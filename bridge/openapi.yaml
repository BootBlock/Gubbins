  /api/v1/items/{id}:
    get:
      tags:
      - "items"
      summary: "Look up one item by id (with placements, capabilities and tags)"
      description: "One item with its full detail. Use `fields`/`$select` to project a sparse fieldset (e.g. just the price) or `include`/`$expand` to add extended fields beyond the default detail payload."
      parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "The item id."
        schema:
          type: "string"
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of item fields to return INSTEAD of the default set (a projection). Naming an extended field (e.g. unitCost, notes) opts it in, so `fields=name,unitCost` returns just those two. Nest an array-of-object field with a dot: `placements.quantity`. An unknown field is a 400. Valid fields: id, name, quantity, isUnlimited, locationId, locationName, categoryId, categoryName, mpn, manufacturer, trackingMode, isActive, description, notes, condition, barcode, isFavourite, serialNumber, serialNo, parentId, unitCost, purchasePrice, currentValue, weight, width, height, depth, expiryDate, batchNumber, lotNumber, acquiredAt, warrantyExpiresAt, depreciationMonths, deadStockMode, reorderPoint, reorderGaugePercent, reorderQty, operationalMetadata, gauge, createdAt, updatedAt, placements, capabilities, tags, fieldValues."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "include"
        in: "query"
        required: false
        description: "Field expansion: a comma-separated list of extended fields, or named groups, to ADD on top of the default payload. Groups: relations (placements, capabilities, categoryName, tags), pricing (unitCost, purchasePrice, currentValue), lifecycle (acquiredAt, warrantyExpiresAt, purchasePrice, depreciationMonths), reorder (reorderPoint, reorderGaugePercent, reorderQty), timestamps (createdAt, updatedAt), fields (fieldValues — the custom-field values, with location inheritance resolved), and all (every extended field). An unknown name is a 400."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$select"
        in: "query"
        required: false
        description: "OData-style alias of `fields` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "$expand"
        in: "query"
        required: false
        description: "OData-style alias of `include` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "capabilities,notes"
      responses:
        "200":
          description: "The item — the full `ItemDetail` shape (plus anything added with `include`/`$expand`) unless `fields`/`$select` projects it to exactly the named fields."
