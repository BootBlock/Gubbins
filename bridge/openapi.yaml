  /api/v1/items/{id}:
    get:
      tags:
      - "items"
      summary: "Look up one item by id (with placements and capabilities)"
      description: "One item with its full detail. Use `fields`/`$select` to project a sparse fieldset (e.g. just the price) or `include`/`$expand` to add extended fields beyond the default detail payload."
      parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "The item id."
        schema:
          type: "string"
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of item fields to return INSTEAD of the default set (a projection). Naming an extended field (e.g. unitCost, notes) opts it in, so `fields=name,unitCost` returns just those two. Nest an array field with a dot: `placements.quantity`. An unknown field is a 400. Valid fields: id, name, quantity, isUnlimited, locationId, locationName, categoryId, categoryName, mpn, manufacturer, trackingMode, isActive, description, notes, condition, serialNumber, serialNo, parentId, unitCost, purchasePrice, weight, width, height, depth, expiryDate, batchNumber, lotNumber, acquiredAt, warrantyExpiresAt, depreciationMonths, reorderPoint, reorderGaugePercent, reorderQty, operationalMetadata, gauge, createdAt, updatedAt, placements, capabilities, fieldValues."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "include"
        in: "query"
        required: false
        description: "Field expansion: a comma-separated list of extended fields, or named groups, to ADD on top of the default payload. Groups: relations (placements, capabilities, categoryName), pricing (unitCost, purchasePrice), lifecycle (acquiredAt, warrantyExpiresAt, purchasePrice, depreciationMonths), reorder (reorderPoint, reorderGaugePercent, reorderQty), timestamps (createdAt, updatedAt), fields (fieldValues — the custom-field values, with location inheritance resolved), and all (every extended field). An unknown name is a 400."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$select"
        in: "query"
        required: false
        description: "OData-style alias of `fields` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "$expand"
        in: "query"
        required: false
        description: "OData-style alias of `include` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "capabilities,notes"
      responses:
        "200":
          description: "The item."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Resource not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
