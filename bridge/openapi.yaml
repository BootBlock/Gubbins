      - "search"
      summary: "Relevance search (top-N, not paginated)"
      description: "Returns up to a hard ceiling of 25 best matches as compact item DTOs. For browsing all items with pagination, use GET /api/v1/items instead. Use `fields` to project only specific fields (e.g. just the price) or `include` to add extended fields."
      parameters:
      -
        name: "q"
        in: "query"
        required: true
