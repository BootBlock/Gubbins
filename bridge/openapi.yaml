  /api/v1/events:
    get:
      tags:
      - "events"
      summary: "Subscribe to the read-only Server-Sent Events stream"
      description: "Opt-in (GUBBINS_BRIDGE_EVENTS=on, or implied by GUBBINS_BRIDGE_WEBHOOKS=on); returns 404 when disabled. Holds the connection open and writes one \"data: <BridgeEvent JSON>\" frame per inventory change, each preceded by an SSE \"id:\" line for Last-Event-ID resumption, plus periodic \": heartbeat\" comment frames. The first generation after a (re)start emits nothing (no history replay). Same bearer token + rate limit as every endpoint; strictly read-only. A 429 is returned when the concurrent-stream cap is reached."
      parameters:
      -
        name: "lastEventId"
        in: "query"
        required: false
        description: "Resume after this event id (a query-string alias of the standard Last-Event-ID header, for clients that cannot set it). Events still buffered after this id are replayed on connect."
        schema:
          type: "string"
      responses:
        "200":
          description: "The event stream."
          content:
            text/event-stream:
              schema:
                type: "string"
              example: "id: hist-0007\ndata: {\"id\":\"hist-0007\",\"type\":\"item.low_stock\",\"occurredAt\":\"2025-06-27T06:13:20.000Z\",\"data\":{\"itemId\":\"item-esp32\",\"itemName\":\"ESP32 Dev Board\",\"action\":\"QUANTITY_CHANGE\",\"kind\":\"stock\",\"label\":\"Quantity changed\",\"detail\":\"Checked out 4.\",\"delta\":\"−4\",\"quantityDelta\":-4,\"netValueDelta\":null,\"item\":null}}\n\n"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/webhooks/deliveries:
    get:
      tags:
      - "webhooks"
      summary: "Read the bridge’s recent webhook delivery outcomes"
      description: "Opt-in (GUBBINS_BRIDGE_WEBHOOKS=on); returns 404 when disabled. The bridge is read-only over a snapshot that is swapped wholesale on every hydration, so it cannot record a delivery outcome back into the database — anything it wrote would be discarded on the next hydrate. It therefore keeps a bounded in-memory log, which the app polls while its Webhooks screen is open. The log does not survive a bridge restart. No secret, signature, request header or query string is ever recorded, and each URL is reduced to its origin and path. Reads the bridge’s own memory rather than the snapshot, so it answers before a snapshot has loaded."
      parameters:
      -
        name: "since"
        in: "query"
        required: false
        description: "Return only records with a higher \"seq\" than this — the polling form. Pass back the \"latestSeq\" from the previous response."
        schema:
          type: "integer"
          minimum: 0
      -
        name: "limit"
        in: "query"
        required: false
        description: "Maximum records to return, clamped to 200."
        schema:
          type: "integer"
          minimum: 1
          maximum: 200
          default: 200
      responses:
        "200":
          description: "The most recent delivery records, newest first."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "deliveries"
                - "latestSeq"
                properties:
                  deliveries:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  latestSeq:
                    type: "integer"
                    description: "The highest sequence number assigned so far. Returned even when the page is empty, so a poller can always advance its cursor."
              example:
                deliveries:
                -
                  seq: 42
                  at: 1751000000000
                  targetId: "7f3a1c58-0b2e-4a1d-9c77-2f5b8e0a1d34"
                  targetName: "Workshop notifier"
                  source: "database"
                  url: "https://hooks.example.test/inventory"
                  method: "POST"
                  eventId: "hist-0007"
                  eventType: "item.low_stock"
                  outcome: "delivered"
                  attempts: 1
                  status: 204
                  detail: null
                latestSeq: 42
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/scale/entities:
    get:
      tags:
      - "scale"
      summary: "List the Home Assistant entities that can be used as a scale"
      description: "Opt-in (GUBBINS_BRIDGE_HA=on); returns 404 when disabled. Projects Home Assistant’s entity states down to those reporting a convertible mass unit, for the app’s scale picker. Reads Home Assistant rather than the snapshot, so it answers before a snapshot has loaded. Strictly read-only — the bridge cannot call a Home Assistant service."
      responses:
        "200":
          description: "The pickable weight sensors."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "entities"
                properties:
                  entities:
                    type: "array"
                    items:
                      type: "object"
                      required:
                      - "entityId"
                      - "name"
                      - "unit"
                      properties:
                        entityId:
                          type: "string"
                          example: "sensor.workshop_scale"
                        name:
                          type: "string"
                          example: "Workshop scale"
                        unit:
                          type: "string"
                          example: "kg"
              example:
                entities:
                -
                  entityId: "sensor.workshop_scale"
                  name: "Workshop scale"
                  unit: "kg"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/scale/state:
    get:
      tags:
      - "scale"
      summary: "Read the current weight from a scale entity, in grams"
      description: "Opt-in (GUBBINS_BRIDGE_HA=on); returns 404 when disabled. Reconciles the sensor’s own unit (mg, g, kg, oz, lb, st) to canonical grams. A reading that cannot be used is a 409 — never a 200 with a zero weight — because the caller turns this number into a stock count: scale_unavailable, scale_unsupported_unit or scale_not_a_number."
      parameters:
      -
        name: "entity_id"
        in: "query"
        required: true
        description: "The Home Assistant entity id of the scale, e.g. sensor.workshop_scale."
        schema:
          type: "string"
      responses:
        "200":
          description: "The current reading."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "entityId"
                - "grams"
                - "value"
                - "unit"
                properties:
                  entityId:
                    type: "string"
                    example: "sensor.workshop_scale"
                  grams:
                    type: "number"
                    description: "The reading in canonical grams."
                    example: 1250
                  value:
                    type: "number"
                    description: "The raw value as reported."
                    example: 1.25
                  unit:
                    type: "string"
                    description: "The unit that raw value was in."
                    example: "kg"
                  lastUpdated:
                    type:
                    - "string"
                    - "null"
                    format: "date-time"
              example:
                entityId: "sensor.workshop_scale"
                grams: 1250
                value: 1.25
                unit: "kg"
                lastUpdated: "2025-06-27T06:13:20.000Z"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "The scale is unavailable, reports an unconvertible unit, or is not numeric."
          content:
            application/json:
              example:
                error:
                  code: "scale_unavailable"
                  message: "The scale is unavailable in Home Assistant."
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "The shared GUBBINS_BRIDGE_TOKEN, sent as \"Authorization: Bearer <token>\"."
  schemas:
    Error:
      type: "object"
      required:
      - "error"
      properties:
        error:
          type: "object"
          required:
          - "code"
          - "message"
          properties:
            code:
              type: "string"
              enum:
              - "bad_request"
              - "unauthorized"
              - "not_found"
              - "method_not_allowed"
              - "too_many_requests"
              - "snapshot_unavailable"
              - "unsupported_media_type"
              - "unprocessable"
              - "payload_too_large"
              - "internal_error"
            message:
              type: "string"
    Pagination:
      type: "object"
      required:
      - "limit"
      - "offset"
      - "count"
      - "hasMore"
      properties:
        limit:
          type: "integer"
          description: "Effective page size after clamping."
        offset:
          type: "integer"
          description: "Zero-based offset of the first row."
        count:
          type: "integer"
          description: "Rows returned in this page (≤ limit)."
        hasMore:
          type: "boolean"
          description: "True when a further page may exist."
        total:
          type: "integer"
          description: "Grand total across all pages — present only when the OData $count=true option is set."
    ApiIndex:
      type: "object"
      properties:
        name:
          type: "string"
          example: "Gubbins Bridge API"
        version:
          type: "string"
          example: "1.0.0"
        openapi:
          type: "string"
          example: "/api/v1/openapi.json"
        writable:
          type: "boolean"
          description: "Whether the opt-in write endpoints are enabled."
        pushable:
          type: "boolean"
          description: "Whether the opt-in snapshot-ingest endpoint is enabled."
        streamable:
          type: "boolean"
          description: "Whether the opt-in read-only SSE event stream (/api/v1/events) is enabled."
        endpoints:
          type: "array"
          items:
            type: "string"
    SnapshotAccepted:
      type: "object"
      required:
      - "ok"
      - "formatVersion"
      - "generatedAt"
      properties:
        ok:
          type: "boolean"
          example: true
        formatVersion:
          type: "integer"
          example: 3
        generatedAt:
          type: "integer"
          description: "UNIX-ms."
          example: 1751004800000
    Health:
      type: "object"
      required:
      - "ok"
      - "itemCount"
      - "snapshotGeneratedAt"
      properties:
        ok:
          type: "boolean"
        itemCount:
          type: "integer"
        snapshotGeneratedAt:
          type: "string"
          nullable: true
          format: "date-time"
    ItemMatch:
      type: "object"
      required:
      - "id"
      - "name"
      - "quantity"
      - "locationId"
      - "locationName"
      - "mpn"
      - "manufacturer"
      properties:
        id:
          type: "string"
          example: "item-esp32"
        name:
          type: "string"
          example: "ESP32 Dev Board"
        quantity:
          type: "integer"
          nullable: true
          example: 7
          description: "On-hand grand total; **null** for an unlimited-supply item (an infinite source has no finite count)."
        locationId:
          type: "string"
          nullable: true
          example: "loc-shelf-2"
          description: "The primary/home location's stable id — what an automation acts on (the name is for a human). Null exactly when locationName is."
        locationName:
          type: "string"
          nullable: true
          example: "Shelf 2"
        mpn:
          type: "string"
          nullable: true
          example: "DEV-ESP32"
        manufacturer:
          type: "string"
          nullable: true
          example: "Synthetic Silicon Co"
    SearchResult:
      type: "object"
      required:
      - "query"
      - "matches"
      properties:
        query:
          type: "string"
          example: "ESP32"
        matches:
          type: "array"
          items:
            $ref: "#/components/schemas/ItemMatch"
    Placement:
      type: "object"
      required:
      - "locationId"
      - "locationName"
      - "quantity"
      properties:
        locationId:
          type: "string"
          example: "loc-shelf-2"
        locationName:
          type: "string"
          example: "Shelf 2"
        quantity:
          type: "integer"
          example: 5
    WhereIsMatch:
      allOf:
      -
        $ref: "#/components/schemas/ItemMatch"
      -
        type: "object"
        required:
        - "placements"
        properties:
          placements:
            type: "array"
            items:
              $ref: "#/components/schemas/Placement"
    WhereIsResult:
      type: "object"
      required:
      - "query"
      - "matches"
      - "spoken"
      properties:
        query:
          type: "string"
          example: "ESP32"
        matches:
          type: "array"
          items:
            $ref: "#/components/schemas/WhereIsMatch"
        spoken:
          type: "string"
          example: "Your ESP32 Dev Board is spread across 2 locations: 5 on Shelf 2 and 2 in Bin 4 — 7 in total."
    Capability:
      type: "object"
      required:
      - "key"
      - "valueNum"
      - "valueText"
      - "weight"
      properties:
        key:
          type: "string"
          example: "voltage"
        valueNum:
          type: "number"
          nullable: true
          example: 3.3
        valueText:
          type: "string"
          nullable: true
          example: null
        weight:
          type: "number"
          example: 2
    ItemFieldValue:
      type: "object"
      description: "One of the item's custom-field values, resolved exactly as the app resolves it: a value set on the item wins, otherwise the value offered by the nearest ancestor location that makes it inheritable, otherwise the field default. Fields with no value are omitted. Read-only."
      required:
      - "name"
      - "fieldType"
      - "value"
      - "source"
      - "inheritedFrom"
      properties:
        name:
          type: "string"
          example: "Datasheet"
        fieldType:
          type: "string"
          example: "TEXT"
        value:
          type: "string"
          example: "https://example.com/esp32.pdf"
        source:
          type: "string"
          enum:
          - "stored"
          - "inherited"
          - "default"
          example: "stored"
          description: "Where the value came from: set on the item (`stored`), inherited from an ancestor location (`inherited`), or the field default (`default`)."
        inheritedFrom:
          type: "object"
          nullable: true
          description: "The location that supplied the value when `source` is `inherited`; null otherwise."
          required:
          - "locationId"
          - "locationName"
          properties:
            locationId:
              type: "string"
              example: "loc-shelf-2"
            locationName:
              type: "string"
              example: "Shelf 2"
    LocationFieldValue:
      type: "object"
      description: "One custom-field value held by a location. Fields with no value are omitted. Read-only."
      required:
      - "name"
      - "fieldType"
      - "value"
      - "isInheritable"
      properties:
        name:
          type: "string"
          example: "Indicator Entity"
        fieldType:
          type: "string"
          example: "TEXT"
        value:
          type: "string"
          example: "light.shelf_two"
        isInheritable:
          type: "boolean"
          example: true
          description: "True when the location offers this value to the items stored beneath it; false when it is the location's own metadata only."
    ItemSummary:
      type: "object"
      required:
      - "id"
      - "name"
      - "quantity"
      - "isUnlimited"
      - "locationId"
      - "locationName"
      - "categoryId"
      - "mpn"
      - "manufacturer"
      - "trackingMode"
      - "isActive"
      properties:
        id:
          type: "string"
          example: "item-m3-bolt"
        name:
          type: "string"
          example: "M3 x 10 Hex Bolt"
        quantity:
          type: "integer"
          nullable: true
          example: 42
          description: "On-hand grand total across every location. **null** for an unlimited-supply item (`isUnlimited: true`) — an effectively infinite source has no finite count."
        isUnlimited:
          type: "boolean"
          example: false
          description: "True for an effectively infinite source (e.g. tap water); its `quantity` is null."
        locationId:
          type: "string"
          example: "loc-drawer-a"
        locationName:
          type: "string"
          nullable: true
          example: "Drawer A"
        categoryId:
          type: "string"
          nullable: true
          example: "cat-fasteners"
        mpn:
          type: "string"
          nullable: true
          example: "FAS-M3-10"
        manufacturer:
          type: "string"
          nullable: true
          example: "Acme Fasteners"
        trackingMode:
          type: "string"
          enum:
          - "DISCRETE"
          - "SERIALISED"
          - "CONSUMABLE_GAUGE"
          - "UNTRACKED"
          example: "DISCRETE"
        isActive:
          type: "boolean"
          example: true
    ItemDetail:
      allOf:
      -
        $ref: "#/components/schemas/ItemSummary"
      -
        type: "object"
        required:
        - "placements"
        - "capabilities"
        properties:
          description:
            type: "string"
            nullable: true
          categoryName:
            type: "string"
            nullable: true
            example: "Fasteners"
          unitCost:
            type: "number"
            nullable: true
          condition:
            type: "string"
            nullable: true
          serialNumber:
            type: "string"
            nullable: true
            example: "SN-2024-0042"
          serialNo:
            type: "integer"
            nullable: true
          parentId:
            type: "string"
            nullable: true
          expiryDate:
            type: "integer"
            nullable: true
          batchNumber:
            type: "string"
            nullable: true
          lotNumber:
            type: "string"
            nullable: true
          createdAt:
            type: "integer"
          updatedAt:
            type: "integer"
          placements:
            type: "array"
            items:
              $ref: "#/components/schemas/Placement"
          capabilities:
            type: "array"
            items:
              $ref: "#/components/schemas/Capability"
          fieldValues:
            type: "array"
            description: "Present only when requested with `include=fields`."
            items:
              $ref: "#/components/schemas/ItemFieldValue"
    Location:
      type: "object"
      required:
      - "id"
      - "name"
      - "parentId"
      - "isSystem"
      - "description"
      - "color"
      - "itemCount"
      properties:
        id:
          type: "string"
          example: "loc-drawer-a"
        name:
          type: "string"
          example: "Drawer A"
        parentId:
          type: "string"
          nullable: true
          example: null
        isSystem:
          type: "boolean"
          example: false
        description:
          type: "string"
          nullable: true
        color:
          type: "string"
          nullable: true
        itemCount:
          type: "integer"
          example: 2
        fieldValues:
          type: "array"
          description: "Present only when requested with `include=fields`."
          items:
            $ref: "#/components/schemas/LocationFieldValue"
    CategoryField:
      type: "object"
      required:
      - "id"
      - "name"
      - "fieldType"
      - "options"
      - "isRequired"
      - "defaultValue"
      - "description"
      - "position"
      properties:
        id:
          type: "string"
        name:
          type: "string"
          example: "Voltage"
        fieldType:
          type: "string"
          example: "TEXT"
        options:
          type: "array"
          items:
            type: "string"
          nullable: true
        isRequired:
          type: "boolean"
        defaultValue:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
          example: "Read from the label on the base."
        position:
          type: "integer"
    CategorySummary:
      type: "object"
      required:
      - "id"
      - "name"
      - "fieldCount"
      properties:
        id:
          type: "string"
          example: "cat-electronics"
        name:
          type: "string"
          example: "Electronics"
        fieldCount:
          type: "integer"
          example: 0
    CategoryDetail:
      type: "object"
      required:
      - "id"
      - "name"
      - "fields"
      properties:
        id:
          type: "string"
          example: "cat-electronics"
        name:
          type: "string"
          example: "Electronics"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CategoryField"
    CapabilityKey:
      type: "object"
      required:
      - "key"
      - "itemCount"
      - "hasNumericValues"
      - "hasTextValues"
      properties:
        key:
          type: "string"
          example: "voltage"
        itemCount:
          type: "integer"
          example: 1
        hasNumericValues:
          type: "boolean"
          example: true
        hasTextValues:
          type: "boolean"
          example: false
    WebhookDelivery:
      type: "object"
      description: "One recorded webhook delivery attempt-sequence. Deliberately carries no secret, signature, request header or query string; the URL is reduced to its origin and path (a GET delivery puts its whole payload in the query, which is exactly why it is dropped)."
      required:
      - "seq"
      - "at"
      - "targetId"
      - "targetName"
      - "source"
      - "url"
      - "method"
      - "eventId"
      - "eventType"
      - "outcome"
      - "attempts"
      - "status"
      - "detail"
      properties:
        seq:
          type: "integer"
          description: "Monotonic per-log sequence number; pass the highest back as \"since\"."
          example: 42
        at:
          type: "integer"
          description: "UNIX-ms when the delivery finished."
        targetId:
          type: "string"
          description: "The subscription id for an app-configured webhook, or \"config:<n>\" for one from the operator’s webhooks.json / GUBBINS_BRIDGE_WEBHOOKS_TARGETS."
        targetName:
          type: "string"
          example: "Workshop notifier"
        source:
          type: "string"
          enum:
          - "database"
          - "config"
          description: "Whether the target came from the app’s synced subscriptions or bridge config."
        url:
          type: "string"
          example: "https://hooks.example.test/inventory"
        method:
          type: "string"
          enum:
          - "POST"
          - "GET"
          - "PUT"
          - "PATCH"
        eventId:
          type: "string"
          example: "hist-0007"
        eventType:
          type: "string"
          enum:
          - "events.truncated"
          - "item.changed"
          - "item.checked_in"
          - "item.checked_out"
          - "item.condition_changed"
          - "item.created"
          - "item.low_stock"
          - "item.maintenance_logged"
          - "item.moved"
          - "item.out_of_stock"
          - "item.removed"
          - "item.renamed"
          - "item.reservation_cleared"
          - "item.reserved"
          - "item.restored"
          - "item.supplier_data_applied"
          - "item.tracking_changed"
          - "lookup.resolved"
          - "stock.adjusted"
        outcome:
          type: "string"
          enum:
          - "delivered"
          - "failed"
          - "blocked"
          - "skipped"
          description: "delivered = the receiver answered 2xx; failed = every attempt was made and none succeeded; blocked = refused before any request was issued (the SSRF guard, or an unresolvable secret reference); skipped = the target’s failure circuit was open."
        attempts:
          type: "integer"
          description: "HTTP attempts made (0 when blocked or skipped)."
          example: 1
        status:
          type: "integer"
          nullable: true
          description: "The final response status, or null when no response was ever received."
          example: 204
        detail:
          type: "string"
          nullable: true
          description: "A short, truncated diagnostic — a transport error or a refusal reason. Never a secret."
    BridgeEventData:
      type: "object"
      required:
      - "itemId"
      - "itemName"
      - "action"
      - "kind"
      - "label"
      - "detail"
      - "delta"
      - "quantityDelta"
      - "netValueDelta"
      - "item"
      properties:
        itemId:
          type: "string"
          example: "item-esp32"
        itemName:
          type: "string"
          example: "ESP32 Dev Board"
        action:
          type: "string"
          description: "The raw §4 activity-ledger action."
          example: "QUANTITY_CHANGE"
        kind:
          type: "string"
          enum:
          - "created"
          - "stock"
          - "movement"
          - "loan"
          - "lifecycle"
          - "supplier"
          description: "The semantic activity kind the action folds into."
          example: "stock"
        label:
          type: "string"
          example: "Quantity changed"
        detail:
          type: "string"
          nullable: true
          example: "Checked out 4."
        delta:
          type: "string"
          nullable: true
          description: "A signed movement badge (\"+3\" / \"−45.5\"), or null when there was no movement."
          example: "−4"
        quantityDelta:
          type: "integer"
          nullable: true
          example: -4
        netValueDelta:
          type: "number"
          nullable: true
          example: null
        item:
          nullable: true
          description: "The item’s current summary, or null when the item is no longer present."
          allOf:
          -
            $ref: "#/components/schemas/ItemSummary"
    LookupEventData:
      type: "object"
      required:
      - "query"
      - "itemIds"
      - "locationIds"
      - "matches"
      description: "The payload of a `lookup.resolved` event. `itemIds` and `locationIds` are the flattened, de-duplicated unions across every match, so an automation can trigger on them without walking `matches`."
      properties:
        query:
          type: "string"
          description: "The query as asked (trimmed), verbatim."
          example: "M3 screws"
        itemIds:
          type: "array"
          description: "Every matched item id, in match order, de-duplicated."
          items:
            type: "string"
          example:
          - "itm-m3-bolt"
        locationIds:
          type: "array"
          description: "Every resolved location id across all matches, in encounter order, de-duplicated."
          items:
            type: "string"
          example:
          - "loc-drawer-a"
        matches:
          type: "array"
          items:
            type: "object"
            required:
            - "itemId"
            - "itemName"
            - "placements"
            properties:
              itemId:
                type: "string"
                example: "itm-m3-bolt"
              itemName:
                type: "string"
                example: "M3 × 10mm bolt"
              placements:
                type: "array"
                description: "Where this item’s stock sits, busiest location first."
                items:
                  type: "object"
                  required:
                  - "locationId"
                  - "locationName"
                  - "quantity"
                  properties:
                    locationId:
                      type: "string"
                      example: "loc-drawer-a"
                    locationName:
                      type: "string"
                      example: "Drawer A"
                    quantity:
                      type: "number"
                      example: 120
    BridgeEvent:
      type: "object"
      required:
      - "id"
      - "type"
      - "occurredAt"
      - "data"
      description: "One event delivered over the SSE stream and to outbound webhooks. `id` is deterministic so a consumer can dedupe; `type` is a stable dotted name. Almost every event is derived from a new row in the history ledger — an inventory *change* — and takes its id from that row. The exception is `lookup.resolved`, which is **read**-triggered (someone asked where an item is, and nothing changed): it has no ledger row, so its id is derived from the resolved query instead, and it is only emitted when its own opt-in flag is enabled."
      properties:
        id:
          type: "string"
          example: "hist-0007"
        type:
          type: "string"
          enum:
          - "events.truncated"
          - "item.changed"
          - "item.checked_in"
          - "item.checked_out"
          - "item.condition_changed"
          - "item.created"
          - "item.low_stock"
          - "item.maintenance_logged"
          - "item.moved"
          - "item.out_of_stock"
          - "item.removed"
          - "item.renamed"
          - "item.reservation_cleared"
          - "item.reserved"
          - "item.restored"
          - "item.supplier_data_applied"
          - "item.tracking_changed"
          - "lookup.resolved"
          - "stock.adjusted"
          example: "item.low_stock"
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the event occurred, as ISO-8601 — the ledger row’s created_at for a ledger-derived event, or the moment the lookup resolved for `lookup.resolved`."
          example: "2025-06-27T06:13:20.000Z"
        data:
          description: "The payload, whose shape follows `type`: `LookupEventData` for `lookup.resolved`, `BridgeEventData` for every ledger-derived event."
          oneOf:
          -
            $ref: "#/components/schemas/BridgeEventData"
          -
            $ref: "#/components/schemas/LookupEventData"
