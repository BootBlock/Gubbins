openapi: "3.0.3"
info:
  title: "Gubbins Bridge API"
  version: "1.0.0"
  description: "Read-only HTTP API over a Gubbins inventory snapshot, served by the local companion bridge. Every endpoint is GET-only and requires a bearer token. The unversioned paths (/health, /search, /where) are permanent, stable aliases of their /api/v1 equivalents, kept so existing consumers (the Home Assistant integration) keep working unchanged."
  license:
    name: "MIT"
servers:
-
  url: "http://127.0.0.1:8787"
  description: "Local bridge (loopback default)."
security:
-
  bearerAuth: []
tags:
-
  name: "meta"
  description: "Liveness and API description."
-
  name: "search"
  description: "Relevance search and \"where is X?\"."
-
  name: "items"
  description: "Browse items and look one up by id."
-
  name: "calendar"
  description: "A read-only iCalendar (.ics) subscription feed of Gubbins’ time-bearing facts — loan due-backs, asset bookings, maintenance/service dates, and warranty expiries — that any calendar app can subscribe to by URL."
-
  name: "feeds"
  description: "Read-only syndication feeds (RSS 2.0, Atom 1.0, JSON Feed 1.1) of the recent activity log — a human \"what changed\" stream any feed reader can subscribe to by URL."
-
  name: "metrics"
  description: "A Prometheus/OpenMetrics text-exposition of the aggregate inventory counts, at the root /metrics path (the scrape convention), for Grafana/Prometheus home-labs."
-
  name: "locations"
  description: "Browse the locations hierarchy."
-
  name: "categories"
  description: "Browse categories and their custom-field schema."
-
  name: "capabilities"
  description: "Browse the queryable capability vocabulary."
-
  name: "writes"
  description: "Opt-in stock mutations (off by default; enabled with GUBBINS_BRIDGE_ALLOW_WRITES=on). Each write round-trips through the same sync merge the PWA uses, so it is applied without drift on the next sync. When writes are disabled these paths return 404."
-
  name: "push"
  description: "Opt-in snapshot ingest — the PWA \"push to bridge\" (off by default; enabled with GUBBINS_BRIDGE_ALLOW_PUSH=on, and only for a JSON snapshot source). Accepts the same versioned backup JSON the bridge reads from a synced folder and replaces it atomically; the watcher then re-hydrates. When push is disabled this path returns 404."
-
  name: "events"
  description: "Opt-in read-only event stream (off by default; enabled with GUBBINS_BRIDGE_EVENTS=on, or implied by GUBBINS_BRIDGE_WEBHOOKS=on). A Server-Sent Events feed of typed inventory-change events, the same events delivered to outbound webhooks. When disabled this path returns 404."
-
  name: "webhooks"
  description: "Opt-in outbound webhooks (off by default; enabled with GUBBINS_BRIDGE_WEBHOOKS=on). The bridge is the sole deliverer: subscriptions are configured in the app and arrive over the existing sync, and the operator’s webhooks.json / GUBBINS_BRIDGE_WEBHOOKS_TARGETS entries are merged alongside them. Delivery outcomes cannot be written back into the snapshot (it is swapped wholesale on every hydration), so the bridge keeps an in-memory delivery log and exposes it here for the app to poll. When disabled this path returns 404."
-
  name: "scale"
  description: "Opt-in Home Assistant reads (off by default; enabled with GUBBINS_BRIDGE_HA=on) — the inbound path behind \"count by weight\". Lets the app read a live weight off a Home Assistant scale entity, reconciled to canonical grams. Outbound-only and read-only: the bridge calls Home Assistant and cannot invoke a service. When disabled these return 404."
paths:
  /api/v1:
    get:
      tags:
      - "meta"
      summary: "API index"
      description: "A small discovery document listing the version and available endpoints."
      responses:
        "200":
          description: "The API index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/openapi.json:
    get:
      tags:
      - "meta"
      summary: "This OpenAPI document"
      responses:
        "200":
          description: "The OpenAPI 3 description of this API."
          content:
            application/json:
              schema:
                type: "object"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/$metadata:
    get:
      tags:
      - "meta"
      summary: "OData CSDL $metadata (descriptive, not full-OData conformance)"
      description: "An OData v4 CSDL document describing the read model (the items/locations/categories entity sets and their complex types), for OData-aware tooling. The service implements only the constrained OData query subset, not the whole protocol."
      responses:
        "200":
          description: "The CSDL $metadata XML."
          content:
            application/xml:
              schema:
                type: "string"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/health:
    get:
      tags:
      - "meta"
      summary: "Liveness and a cheap snapshot summary"
      responses:
        "200":
          description: "Health summary."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
                itemCount: 4
                snapshotGeneratedAt: "2025-06-27T06:13:20.000Z"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/search:
    get:
      tags:
      - "search"
      summary: "Relevance search (top-N, not paginated)"
      description: "Returns up to a hard ceiling of 25 best matches as compact item DTOs. For browsing all items with pagination, use GET /api/v1/items instead. Use `fields` to project only specific fields (e.g. just the price) or `include` to add extended fields."
      parameters:
      -
        name: "q"
        in: "query"
        required: true
        description: "Search query. Accepts the app's full grammar (field:value, cap:key>n, AND/OR/parens) as well as a casual phrase like \"M3 bolt\". Max 200 characters."
        schema:
          type: "string"
          maxLength: 200
        example: "M3 bolt"
      -
        name: "limit"
        in: "query"
        required: false
        description: "Max results, clamped to [1, 25]. Defaults to 5."
        schema:
          type: "integer"
          minimum: 1
          maximum: 25
          default: 5
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of item fields to return INSTEAD of the default set (a projection). Naming an extended field (e.g. unitCost, notes) opts it in, so `fields=name,unitCost` returns just those two. Nest an array field with a dot: `placements.quantity`. An unknown field is a 400. Valid fields: id, name, quantity, isUnlimited, locationId, locationName, categoryId, categoryName, mpn, manufacturer, trackingMode, isActive, description, notes, condition, serialNumber, serialNo, parentId, unitCost, purchasePrice, weight, width, height, depth, expiryDate, batchNumber, lotNumber, acquiredAt, warrantyExpiresAt, depreciationMonths, reorderPoint, reorderGaugePercent, reorderQty, operationalMetadata, gauge, createdAt, updatedAt, placements, capabilities, fieldValues."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "include"
        in: "query"
        required: false
        description: "Field expansion: a comma-separated list of extended fields, or named groups, to ADD on top of the default payload. Groups: relations (placements, capabilities, categoryName), pricing (unitCost, purchasePrice), lifecycle (acquiredAt, warrantyExpiresAt, purchasePrice, depreciationMonths), reorder (reorderPoint, reorderGaugePercent, reorderQty), timestamps (createdAt, updatedAt), fields (fieldValues — the custom-field values, with location inheritance resolved), and all (every extended field). An unknown name is a 400."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$select"
        in: "query"
        required: false
        description: "OData-style alias of `fields` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "$expand"
        in: "query"
        required: false
        description: "OData-style alias of `include` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$top"
        in: "query"
        required: false
        description: "OData-style alias of `limit` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "10"
      responses:
        "200":
          description: "The matches."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/where:
    get:
      tags:
      - "search"
      summary: "\"Where is X?\" — matches with per-location breakdown + a spoken sentence"
      parameters:
      -
        name: "q"
        in: "query"
        required: true
        description: "Search query. Accepts the app's full grammar (field:value, cap:key>n, AND/OR/parens) as well as a casual phrase like \"M3 bolt\". Max 200 characters."
        schema:
          type: "string"
          maxLength: 200
        example: "M3 bolt"
      responses:
        "200":
          description: "The enriched answer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhereIsResult"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/items:
    get:
      tags:
      - "items"
      summary: "Browse items (paginated)"
      description: "Paginated item summaries. Use `fields`/`$select` to project a sparse fieldset, `include`/`$expand` to add extended fields, `$orderby` to sort, and `$filter` for a constrained OData-style boolean filter. `$top`/`$skip` alias `limit`/`offset`."
      parameters:
      -
        name: "limit"
        in: "query"
        required: false
        description: "Page size, clamped to [1, 100]. Defaults to 50."
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
          default: 50
      -
        name: "offset"
        in: "query"
        required: false
        description: "Zero-based row offset. Defaults to 0."
        schema:
          type: "integer"
          minimum: 0
          default: 0
      -
        name: "location"
        in: "query"
        required: false
        description: "Filter to items whose home location is this location id (ignored when $filter is set)."
        schema:
          type: "string"
      -
        name: "category"
        in: "query"
        required: false
        description: "Filter to items in this category id (ignored when $filter is set)."
        schema:
          type: "string"
      -
        name: "includeInactive"
        in: "query"
        required: false
        description: "Include soft-deleted items when \"true\". Defaults to active only."
        schema:
          type: "boolean"
          default: false
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of item fields to return INSTEAD of the default set (a projection). Naming an extended field (e.g. unitCost, notes) opts it in, so `fields=name,unitCost` returns just those two. Nest an array field with a dot: `placements.quantity`. An unknown field is a 400. Valid fields: id, name, quantity, isUnlimited, locationId, locationName, categoryId, categoryName, mpn, manufacturer, trackingMode, isActive, description, notes, condition, serialNumber, serialNo, parentId, unitCost, purchasePrice, weight, width, height, depth, expiryDate, batchNumber, lotNumber, acquiredAt, warrantyExpiresAt, depreciationMonths, reorderPoint, reorderGaugePercent, reorderQty, operationalMetadata, gauge, createdAt, updatedAt, placements, capabilities, fieldValues."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "include"
        in: "query"
        required: false
        description: "Field expansion: a comma-separated list of extended fields, or named groups, to ADD on top of the default payload. Groups: relations (placements, capabilities, categoryName), pricing (unitCost, purchasePrice), lifecycle (acquiredAt, warrantyExpiresAt, purchasePrice, depreciationMonths), reorder (reorderPoint, reorderGaugePercent, reorderQty), timestamps (createdAt, updatedAt), fields (fieldValues — the custom-field values, with location inheritance resolved), and all (every extended field). An unknown name is a 400."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$select"
        in: "query"
        required: false
        description: "OData-style alias of `fields` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "$expand"
        in: "query"
        required: false
        description: "OData-style alias of `include` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "capabilities,notes"
      -
        name: "$top"
        in: "query"
        required: false
        description: "OData-style alias of `limit` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "10"
      -
        name: "$skip"
        in: "query"
        required: false
        description: "OData-style alias of `offset` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "0"
      -
        name: "$orderby"
        in: "query"
        required: false
        description: "Sort the result: a comma-separated list of \"<field> [asc|desc]\" terms (default asc). Sortable fields: name, quantity, unitCost, mpn, manufacturer, createdAt, updatedAt, serialNo. NULLs sort last; ties break on id for stable pagination. An unknown field is a 400."
        schema:
          type: "string"
        example: "quantity desc,name"
      -
        name: "$filter"
        in: "query"
        required: false
        description: "A constrained OData-style boolean filter compiled to the app search AST (never bespoke SQL). Supported: comparisons eq/gt/lt, the contains(field, string) function, and/or with parentheses. Filterable fields: name, description, notes, mpn, manufacturer, serialNumber, quantity, weight, width, height, depth, category(Id), location(Id). Unsupported operators (ne/ge/le, not, startswith, arithmetic, lambdas) are a 400. When present it is the sole row filter (location/category are ignored)."
        schema:
          type: "string"
        example: "quantity gt 10 and contains(name,'bolt')"
      -
        name: "$count"
        in: "query"
        required: false
        description: "When \"true\", include the grand total of matching rows (across all pages) as `pagination.total`. Costs one extra COUNT query."
        schema:
          type: "boolean"
          default: false
        example: "true"
      -
        name: "$search"
        in: "query"
        required: false
        description: "Free-text search across the item name/description/notes/mpn/manufacturer/serial number via the FTS5 index (ignored when $filter is set)."
        schema:
          type: "string"
        example: "esp32"
      responses:
        "200":
          description: "A page of results."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "pagination"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ItemSummary"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/items/$count:
    get:
      tags:
      - "items"
      summary: "The count of matching items (OData inline-count path)"
      description: "Returns the grand total of matching items as a bare text/plain integer, honouring the same $filter/$search/location/category scope as GET /api/v1/items."
      parameters:
      -
        name: "$filter"
        in: "query"
        required: false
        description: "A constrained OData-style boolean filter compiled to the app search AST (never bespoke SQL). Supported: comparisons eq/gt/lt, the contains(field, string) function, and/or with parentheses. Filterable fields: name, description, notes, mpn, manufacturer, serialNumber, quantity, weight, width, height, depth, category(Id), location(Id). Unsupported operators (ne/ge/le, not, startswith, arithmetic, lambdas) are a 400. When present it is the sole row filter (location/category are ignored)."
        schema:
          type: "string"
        example: "quantity gt 10 and contains(name,'bolt')"
      -
        name: "$search"
        in: "query"
        required: false
        description: "Free-text search across the item name/description/notes/mpn/manufacturer/serial number via the FTS5 index (ignored when $filter is set)."
        schema:
          type: "string"
        example: "esp32"
      responses:
        "200":
          description: "The count, as a plain-text integer."
          content:
            text/plain:
              schema:
                type: "integer"
              example: 4
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/items.csv:
    get:
      tags:
      - "items"
      summary: "Export matching items as a CSV (refreshable spreadsheet pull)"
      description: "A spreadsheet-friendly CSV download of the matching items (columns: id, name, description, notes, trackingMode, quantity, isUnlimited, mpn, manufacturer, unitCost — the same shape as the app's own export; the quantity cell is blank for an unlimited-supply row). Honours the same $filter/$search/$orderby/location/category/includeInactive scope as GET /api/v1/items, and returns ALL matching rows (up to a hard cap), not a single page. Point Excel/Power BI \"From Web\" at it for a refreshable pull."
      parameters:
      -
        name: "$filter"
        in: "query"
        required: false
        description: "A constrained OData-style boolean filter compiled to the app search AST (never bespoke SQL). Supported: comparisons eq/gt/lt, the contains(field, string) function, and/or with parentheses. Filterable fields: name, description, notes, mpn, manufacturer, serialNumber, quantity, weight, width, height, depth, category(Id), location(Id). Unsupported operators (ne/ge/le, not, startswith, arithmetic, lambdas) are a 400. When present it is the sole row filter (location/category are ignored)."
        schema:
          type: "string"
        example: "quantity gt 10 and contains(name,'bolt')"
      -
        name: "$search"
        in: "query"
        required: false
        description: "Free-text search across the item name/description/notes/mpn/manufacturer/serial number via the FTS5 index (ignored when $filter is set)."
        schema:
          type: "string"
        example: "esp32"
      -
        name: "$orderby"
        in: "query"
        required: false
        description: "Sort the result: a comma-separated list of \"<field> [asc|desc]\" terms (default asc). Sortable fields: name, quantity, unitCost, mpn, manufacturer, createdAt, updatedAt, serialNo. NULLs sort last; ties break on id for stable pagination. An unknown field is a 400."
        schema:
          type: "string"
        example: "quantity desc,name"
      responses:
        "200":
          description: "The CSV file (RFC-4180, CRLF rows)."
          content:
            text/csv:
              schema:
                type: "string"
              example: "id,name,description,notes,trackingMode,quantity,isUnlimited,mpn,manufacturer,unitCost\r\nitem-esp32,ESP32 Dev Board,,,DISCRETE,7,false,DEV-ESP32,Synthetic Silicon Co,"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Snapshot not loaded yet."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/calendar.ics:
    get:
      tags:
      - "calendar"
      summary: "Subscribe to the read-only iCalendar feed"
      description: "A text/calendar (RFC 5545) VCALENDAR of Gubbins’ time-bearing facts, as VEVENTs with a stable per-source UID so a subscriber updates each event in place rather than duplicating it on refetch. Sources: loan due-backs (open checkouts with a due date), asset bookings (upcoming, not-yet-passed), maintenance/service due dates (time-based schedules), and warranty expiries. Most events are all-day. A source with no data simply contributes nothing (a valid, empty calendar is the natural result). Because a calendar client cannot send an Authorization header, this endpoint ALSO accepts the bearer token as a `token` query parameter (a deliberately weaker token-in-URL posture, scoped to this one path — keep the bridge loopback/LAN posture in mind). Read-only."
      parameters:
      -
        name: "token"
        in: "query"
        required: false
        description: "The shared bearer token, for calendar clients that cannot send an Authorization header. Accepted on THIS path only; prefer the Authorization header everywhere else."
        schema:
          type: "string"
      -
        name: "type"
        in: "query"
        required: false
        description: "Restrict the feed to a comma-separated subset of sources: loans, bookings, maintenance, warranty. Omitted = all four. An unknown value is a 400."
        schema:
          type: "string"
        example: "loans,warranty"
      responses:
        "200":
          description: "The iCalendar document."
          content:
            text/calendar:
              schema:
                type: "string"
              example: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Gubbins//Bridge Calendar//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Gubbins\r\nBEGIN:VEVENT\r\nUID:warranty-item-esp32@gubbins.invalid\r\nDTSTAMP:20250627T045320Z\r\nDTSTART;VALUE=DATE:20270615\r\nDTEND;VALUE=DATE:20270616\r\nSUMMARY:Warranty expires: ESP32 Dev Board\r\nCATEGORIES:Gubbins,Warranty\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n"
        "400":
          description: "Bad request — missing or invalid parameter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or invalid bearer token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
