  /api/v1/odata/$metadata:
    get:
      tags:
      - "odata"
      summary: "OData CSDL $metadata"
      description: "The OData v4 CSDL describing the read model — the items/locations/categories entity sets, their complex types, which properties a default (unprojected) request returns, and the Org.OData.Capabilities.V1 restrictions naming exactly what each set can be filtered, sorted, counted and searched on. Answered without a loaded snapshot."
      responses:
        "200":
          description: "The CSDL $metadata XML."
          content:
            application/xml:
              schema:
                type: "string"
        "401":
          description: "Missing, unknown or revoked API token."
          headers:
            WWW-Authenticate:
