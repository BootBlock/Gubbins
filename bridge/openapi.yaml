  /metrics:
    get:
      tags:
      - "metrics"
      summary: "Prometheus/OpenMetrics exposition of the aggregate inventory counts"
      description: "A text/plain (version=0.0.4) Prometheus exposition a scrape accepts directly, at the root /metrics path (the scrape convention) rather than under /api/v1. Gauges: gubbins_items_total, gubbins_low_stock_items, gubbins_out_of_stock_items, gubbins_locations_total, and the per-location gubbins_location_items / gubbins_location_capacity / gubbins_location_fullness_ratio (labelled by location). The low/out-of-stock counts reuse the same seams as the event stream and MQTT, so they never drift. Auth is header-only here (no ?token=); a scrape config sends the bearer token. A client that revalidates with the previous ETag is answered 304 Not Modified while the snapshot is unchanged; a Prometheus scrape sends no conditional header and is unaffected."
      parameters:
      -
        name: "If-None-Match"
        in: "header"
        required: false
        description: "The weak ETag from a previous response. Matches ⇒ 304 Not Modified. Takes precedence over If-Modified-Since."
        schema:
          type: "string"
        example: "W/\"3Qk1s0Zk9pQmVzdEV0YWc\""
      -
        name: "If-Modified-Since"
        in: "header"
        required: false
        description: "The Last-Modified value from a previous response, for a client that keeps no ETag. Only consulted when If-None-Match is absent."
        schema:
          type: "string"
        example: "Fri, 27 Jun 2025 04:53:20 GMT"
      responses:
        "200":
          description: "The metrics exposition."
          headers:
            ETag:
              schema:
                type: "string"
              description: "The weak entity-tag of this representation."
            Last-Modified:
              schema:
                type: "string"
              description: "When this representation last changed."
            Cache-Control:
              schema:
                type: "string"
              description: "private, no-cache — store it, but revalidate every time. Private because a feed carries personal inventory behind a bearer token, so no shared cache may hold a copy."
          content:
            text/plain:
              schema:
                type: "string"
              example: "# HELP gubbins_items_total Total active items in the inventory.\n# TYPE gubbins_items_total gauge\ngubbins_items_total 4\n# HELP gubbins_low_stock_items Active items at or below their low-stock threshold.\n# TYPE gubbins_low_stock_items gauge\ngubbins_low_stock_items 1\n"
        "304":
          description: "The cached copy is still current — nothing has changed since the snapshot (or, for the calendar, the day) the validators name. No body."
          headers:
            ETag:
              schema:
                type: "string"
              description: "The weak entity-tag of this representation."
            Last-Modified:
              schema:
                type: "string"
              description: "When this representation last changed."
            Cache-Control:
              schema:
                type: "string"
              description: "private, no-cache — store it, but revalidate every time. Private because a feed carries personal inventory behind a bearer token, so no shared cache may hold a copy."
        "401":
          description: "Missing, unknown or revoked API token."
          headers:
