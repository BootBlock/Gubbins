  /api/v1/odata:
    get:
      tags:
      - "odata"
      summary: "OData service document — the entity sets on offer"
      description: "The document an OData client reads first (OData Protocol §11.1.1): a @odata.context pointing at $metadata and a value array naming the items, locations and categories entity sets. Answered without a loaded snapshot — it describes the service, not the inventory."
      responses:
        "200":
          description: "The service document."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "@odata.context"
                - "value"
                properties:
                  "@odata.context":
                    type: "string"
                  value:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        name:
                          type: "string"
                        kind:
                          type: "string"
                        url:
                          type: "string"
              example:
                "@odata.context": "http://127.0.0.1:8787/api/v1/odata/$metadata"
                value:
                -
                  name: "items"
                  kind: "EntitySet"
                  url: "items"
        "401":
          description: "Missing, unknown or revoked API token."
          headers:
            WWW-Authenticate:
              schema:
