  /api/v1/webhooks/deliveries:
    get:
      tags:
      - "webhooks"
      summary: "Read the bridge’s recent webhook delivery outcomes"
      description: "Opt-in (GUBBINS_BRIDGE_WEBHOOKS=on); returns 404 when disabled. The bridge is read-only over a snapshot that is swapped wholesale on every hydration, so it cannot record a delivery outcome back into the database — anything it wrote would be discarded on the next hydrate. It therefore keeps a bounded in-memory log, which the app polls while its Webhooks screen is open. The log does not survive a bridge restart. No secret, signature, request header or query string is ever recorded, and each URL is reduced to its origin and path. Reads the bridge’s own memory rather than the snapshot — but, like every path, it still answers 503 until one has loaded, because the tokens that identify the caller arrive in that snapshot."
      parameters:
      -
        name: "since"
        in: "query"
        required: false
        description: "Return only records with a higher \"seq\" than this — the polling form. Pass back the \"latestSeq\" from the previous response."
        schema:
          type: "integer"
          minimum: 0
      -
        name: "limit"
        in: "query"
        required: false
        description: "Maximum records to return, clamped to 200."
        schema:
          type: "integer"
          minimum: 1
          maximum: 200
          default: 200
      responses:
        "200":
          description: "The most recent delivery records, newest first."
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "deliveries"
                - "latestSeq"
                properties:
                  deliveries:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
                  latestSeq:
                    type: "integer"
                    description: "The highest sequence number assigned so far. Returned even when the page is empty, so a poller can always advance its cursor."
              example:
                deliveries:
                -
                  seq: 42
                  at: 1751000000000
                  targetId: "7f3a1c58-0b2e-4a1d-9c77-2f5b8e0a1d34"
                  targetName: "Workshop notifier"
                  source: "database"
                  url: "https://hooks.example.test/inventory"
                  method: "POST"
                  eventId: "hist-0007"
                  eventType: "item.low_stock"
                  outcome: "delivered"
                  attempts: 1
                  status: 204
                  detail: null
                latestSeq: 42
        "400":
