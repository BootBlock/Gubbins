      description: "The physical storage hierarchy, each entry with its live item count. Use `include=fields` to add `fieldValues` — the location's custom-field values, which is where a user records metadata such as the entity id of a light above a shelf."
      parameters:
      -
        name: "limit"
        in: "query"
