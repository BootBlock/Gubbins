  /api/v1/calendar.ics:
    get:
      tags:
      - "calendar"
      summary: "Subscribe to the read-only iCalendar feed"
      description: "A text/calendar (RFC 5545) VCALENDAR of Gubbins’ time-bearing facts, as VEVENTs with a stable per-source UID so a subscriber updates each event in place rather than duplicating it on refetch. Sources: loan due-backs (open checkouts with a due date), asset bookings (upcoming, not-yet-passed), maintenance/service due dates (time-based schedules), and warranty expiries. Most events are all-day. A source with no data simply contributes nothing (a valid, empty calendar is the natural result). Because a calendar client cannot send an Authorization header, this endpoint ALSO accepts the bearer token as a `token` query parameter (a deliberately weaker token-in-URL posture, scoped to this one path — keep the bridge loopback/LAN posture in mind). Read-only. A poll that sends back the previous ETag is answered 304 Not Modified until the snapshot changes (or a day-grained cut-off rolls over), so a subscription costs a header exchange."
      parameters:
      -
        name: "token"
        in: "query"
        required: false
        description: "The shared bearer token, for calendar clients that cannot send an Authorization header. Accepted on THIS path only; prefer the Authorization header everywhere else."
        schema:
          type: "string"
      -
        name: "type"
        in: "query"
        required: false
        description: "Restrict the feed to a comma-separated subset of sources: loans, bookings, maintenance, warranty. Omitted = all four. An unknown value is a 400."
