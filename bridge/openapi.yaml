        name: "offset"
        in: "query"
        required: false
        description: "Zero-based row offset. Defaults to 0."
        schema:
          type: "integer"
          minimum: 0
          default: 0
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of location fields to return INSTEAD of the default set. Valid fields: id, name, parentId, isSystem, description, color, itemCount, fieldValues. Nest the array field with a dot: `fieldValues.value`. An unknown field is a 400."
