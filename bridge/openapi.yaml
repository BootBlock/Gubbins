  /api/v1/locations/{id}:
    get:
      tags:
      - "locations"
      summary: "Look up one location by id"
      description: "One location with its live item count. Use `include=fields` to add the location's custom-field values (`fieldValues`)."
      parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "The location id."
        schema:
          type: "string"
      -
        name: "fields"
        in: "query"
        required: false
        description: "Sparse fieldset: a comma-separated list of location fields to return INSTEAD of the default set. Valid fields: id, name, parentId, isSystem, description, color, itemCount, fieldValues. Nest the array field with a dot: `fieldValues.value`. An unknown field is a 400."
        schema:
          type: "string"
        example: "id,name,fieldValues"
      -
        name: "include"
        in: "query"
        required: false
        description: "Field expansion: a comma-separated list of extended fields, or named groups, to ADD on top of the default payload. Groups: fields (fieldValues — the location's custom-field values) and all. An unknown name is a 400."
        schema:
          type: "string"
        example: "fields"
      -
        name: "$select"
        in: "query"
        required: false
        description: "OData-style alias of `fields` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "name,unitCost"
      -
        name: "$expand"
        in: "query"
        required: false
        description: "OData-style alias of `include` (this alias wins if both are given)."
        schema:
          type: "string"
        example: "capabilities,notes"
