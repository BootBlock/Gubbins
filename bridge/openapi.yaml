  /api/v1/$metadata:
    get:
      tags:
      - "odata"
      summary: "Moved — redirects to the OData service’s own $metadata"
      description: "A CSDL is only actionable from the service root whose entity sets it declares, so the document now lives at /api/v1/odata/$metadata. This path answers 301 with that location; every OData client follows it."
      responses:
