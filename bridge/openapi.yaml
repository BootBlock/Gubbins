      description: "Opt-in (GUBBINS_BRIDGE_ALLOW_PUSH=on, JSON source only); returns 404 when push is disabled or the source is a raw .sqlite. A separate opt-in from writes but a wider privilege — it merges caller-supplied content into the whole served dataset, not a single bounded stock delta. Accepts the same versioned backup JSON the PWA writes to a synced folder, validates it with the format-version guard, merges it into the served snapshot (placed verbatim only when there is nothing to merge into) and writes the result atomically. The watcher then re-hydrates it through the normal path, so subsequent reads reflect the pushed data. The body is capped at GUBBINS_BRIDGE_MAX_PUSH_BYTES (default 64 MiB)."
