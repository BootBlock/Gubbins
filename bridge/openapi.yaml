          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "delta"
              properties:
                delta:
                  type: "number"
                  description: "Whole-number change; negative to check out."
                  example: -1
                note:
                  type: "string"
                  nullable: true
                  maxLength: 500
                  description: "Optional note recorded in the activity log."
