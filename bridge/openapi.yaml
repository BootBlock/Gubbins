            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The token is valid, but its owner's role does not permit this route."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The Home Assistant read is disabled, or the entity is not a scale (or does not exist). A non-scale entity is deliberately indistinguishable from a missing one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "not_found"
                  message: "No such entity."
        "405":
          description: "The request method is not allowed. The bridge answers GET and HEAD everywhere, and POST only on the opt-in write, snapshot-ingest and webhook-test paths. Declared on every operation because the method guard runs ahead of routing, so it answers any request to this path — not only the method documented here. That is also why `Allow` is answered bridge-wide there rather than per path: on a bridge with a POST opt-in enabled it names POST even for a path that only reads. A POST the versioned router itself refuses is the one case answered with that resource’s own methods."
          headers:
            Allow:
              schema:
                type: "string"
              description: "The methods the bridge serves, e.g. \"GET, HEAD, OPTIONS\" — see the description above for when this is bridge-wide rather than scoped to the path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "A genuine scale that is unavailable, or is not reporting a numeric weight."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "scale_unavailable"
                  message: "The scale is unavailable in Home Assistant."
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "An unexpected failure the bridge could not attribute to the request. The message is fixed and detail-free — no stack trace, file path, SQL or query text ever reaches a caller (the detail is logged locally only)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "Home Assistant could not be reached, refused the bridge’s access token, or answered unusably: home_assistant_unreachable, home_assistant_unauthorised or home_assistant_error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "No snapshot has been loaded yet, so the bridge does not yet know who any caller is and lets nobody in. Reachable at every path — including the reads that need no snapshot data of their own — because the check precedes routing. Retry once the snapshot lands."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      description: "A per-user API token minted in the Gubbins app (Users → a user → API tokens), sent as \"Authorization: Bearer <token>\". The bridge resolves it to that user and enforces their permissions on every route; a route their role does not reach is a 403."
  schemas:
    Error:
      type: "object"
      required:
      - "error"
      properties:
        error:
          type: "object"
          required:
          - "code"
          - "message"
          properties:
            code:
              type: "string"
              enum:
              - "bad_request"
              - "unauthorized"
              - "forbidden"
              - "not_found"
              - "method_not_allowed"
              - "too_many_requests"
              - "snapshot_unavailable"
              - "unsupported_media_type"
              - "unprocessable"
              - "payload_too_large"
              - "scale_unavailable"
              - "scale_not_a_number"
              - "home_assistant_unreachable"
              - "home_assistant_unauthorised"
              - "home_assistant_error"
              - "internal_error"
            message:
              type: "string"
    LegacyError:
      type: "object"
      required:
      - "error"
      properties:
        error:
          type: "string"
          description: "A short, secret-free explanation. No machine-readable code accompanies it."
          example: "Method not allowed"
    Pagination:
      type: "object"
      required:
      - "limit"
      - "offset"
      - "count"
      - "hasMore"
      properties:
        limit:
          type: "integer"
          description: "Effective page size after clamping."
        offset:
          type: "integer"
          description: "Zero-based offset of the first row."
        count:
          type: "integer"
          description: "Rows returned in this page (≤ limit)."
        hasMore:
          type: "boolean"
          description: "True when a further page may exist."
        total:
          type: "integer"
          description: "Grand total across all pages — present only when the OData $count=true option is set."
    ApiIndex:
      type: "object"
      properties:
        name:
          type: "string"
          example: "Gubbins Bridge API"
        version:
          type: "string"
          description: "The API contract version — what these endpoints promise. Distinct from \"bridge\", which says which build is answering."
          example: "1.0.0"
        bridge:
          type: "object"
          description: "Which build of Gubbins this bridge is. The bridge ships as source with no separate release, so it reports the repository version it was taken from; a client that knows its own can spot a bridge left behind."
          properties:
            version:
              type: "string"
              example: "0.3.0"
            schemaVersion:
              type: "integer"
              description: "The stored-data compatibility generation. A bridge behind on this may read the snapshot with out-of-date assumptions."
              example: 5
        openapi:
          type: "string"
          example: "/api/v1/openapi.json"
        writable:
          type: "boolean"
          description: "Whether the opt-in write endpoints are enabled."
        pushable:
          type: "boolean"
          description: "Whether the opt-in snapshot-ingest endpoint is enabled."
        streamable:
          type: "boolean"
          description: "Whether the opt-in read-only SSE event stream (/api/v1/events) is enabled."
        scalable:
          type: "boolean"
          description: "Whether the opt-in Home Assistant read is enabled, i.e. whether \"count by weight\" can pull a live reading off a scale entity."
        endpoints:
          type: "array"
          items:
            type: "string"
    SnapshotAccepted:
      type: "object"
      required:
      - "ok"
      - "formatVersion"
      - "generatedAt"
      properties:
        ok:
          type: "boolean"
          example: true
        formatVersion:
          type: "integer"
          example: 3
        generatedAt:
          type: "integer"
          description: "UNIX-ms."
          example: 1751004800000
    Health:
      type: "object"
      required:
      - "ok"
      - "itemCount"
      - "snapshotGeneratedAt"
      - "snapshotStale"
      - "reloadFailures"
      - "lastReloadError"
      - "lastReloadErrorAt"
      - "lastReloadAt"
      properties:
        ok:
          type: "boolean"
          description: "False once the snapshot is stale — the bridge is still answering, but from data it knows is out of date. Treat a false value as \"do not trust these numbers\"."
        itemCount:
          type: "integer"
        snapshotGeneratedAt:
          type: "string"
          nullable: true
          format: "date-time"
        snapshotStale:
          type: "boolean"
          description: "Reloads have failed enough times in a row to call the served data stale."
        reloadFailures:
          type: "integer"
          description: "Consecutive failed snapshot reloads since the last successful one."
        lastReloadError:
          type: "string"
          nullable: true
          description: "Why the last reload failed."
        lastReloadErrorAt:
          type: "string"
          nullable: true
          format: "date-time"
        lastReloadAt:
          type: "string"
          nullable: true
          format: "date-time"
          description: "When the served snapshot was last loaded successfully."
    ItemStatusCounts:
      type: "object"
      required:
      - "statuses"
      - "snapshotGeneratedAt"
      properties:
        statuses:
          type: "object"
          description: "One non-negative count per attention status. Derived from the canonical status list, so it cannot drift from the filters the app itself offers."
          required:
          - "low-stock"
          - "out-of-stock"
          - "on-order"
          - "expiring"
          - "warranty"
          - "on-loan"
          - "overdue"
          - "maintenance-due"
          properties:
            low-stock:
              type: "integer"
              minimum: 0
            out-of-stock:
              type: "integer"
              minimum: 0
            on-order:
              type: "integer"
              minimum: 0
            expiring:
              type: "integer"
              minimum: 0
            warranty:
              type: "integer"
              minimum: 0
            on-loan:
              type: "integer"
              minimum: 0
            overdue:
              type: "integer"
              minimum: 0
            maintenance-due:
              type: "integer"
              minimum: 0
          additionalProperties: false
        snapshotGeneratedAt:
          type: "string"
          nullable: true
          format: "date-time"
          description: "When the snapshot these counts were read from was generated."
    ItemMatch:
      type: "object"
      required:
      - "id"
      - "name"
      - "quantity"
      - "locationId"
      - "locationName"
      - "mpn"
      - "manufacturer"
      properties:
        id:
          type: "string"
          example: "item-esp32"
        name:
          type: "string"
          example: "ESP32 Dev Board"
        quantity:
          type: "integer"
          nullable: true
          example: 7
          description: "On-hand grand total; **null** for an unlimited-supply item (an infinite source has no finite count)."
        locationId:
          type: "string"
          nullable: true
          example: "loc-shelf-2"
          description: "The primary/home location's stable id — what an automation acts on (the name is for a human). Null exactly when locationName is."
        locationName:
          type: "string"
          nullable: true
          example: "Shelf 2"
        mpn:
          type: "string"
          nullable: true
          example: "DEV-ESP32"
        manufacturer:
          type: "string"
          nullable: true
          example: "Synthetic Silicon Co"
    SearchResult:
      type: "object"
      required:
      - "query"
      - "matches"
      properties:
        query:
          type: "string"
          example: "ESP32"
        matches:
          type: "array"
          description: "Plain — with no `fields`/`include` (or `$select`/`$expand`) — every match is the compact `ItemMatch`. With a selection each match is an `ItemProjection` instead: the selected item fields and nothing else. The two are genuinely different shapes (among other things `ItemMatch` resolves `locationId` through the locations table, so it can be null), which is why both are listed rather than one covering both."
          items:
            anyOf:
            -
              $ref: "#/components/schemas/ItemMatch"
            -
              $ref: "#/components/schemas/ItemProjection"
    Placement:
      type: "object"
      required:
      - "locationId"
      - "locationName"
      - "quantity"
      properties:
        locationId:
          type: "string"
          example: "loc-shelf-2"
        locationName:
          type: "string"
          example: "Shelf 2"
        quantity:
          type: "integer"
          example: 5
    PlacementProjection:
      type: "object"
      properties:
        locationId:
          type: "string"
          example: "loc-shelf-2"
        locationName:
          type: "string"
          example: "Shelf 2"
        quantity:
          type: "integer"
          example: 5
      description: "Returned by a read that accepts a sparse fieldset: a dotted path such as `placements.quantity` narrows each element to exactly the named sub-keys, so no property here is required. Without one, every property below is present."
    WhereIsMatch:
      allOf:
      -
        $ref: "#/components/schemas/ItemMatch"
      -
        type: "object"
        required:
        - "placements"
        properties:
          placements:
            type: "array"
            items:
              $ref: "#/components/schemas/Placement"
    WhereIsResult:
      type: "object"
      required:
      - "query"
      - "matches"
      - "spoken"
      properties:
        query:
          type: "string"
          example: "ESP32"
        matches:
          type: "array"
          items:
            $ref: "#/components/schemas/WhereIsMatch"
        spoken:
          type: "string"
          example: "Your ESP32 Dev Board is spread across 2 locations: 5 on Shelf 2 and 2 in Bin 4 — 7 in total."
    Capability:
      type: "object"
      required:
      - "key"
      - "valueNum"
      - "valueText"
      - "weight"
      properties:
        key:
          type: "string"
          example: "voltage"
        valueNum:
          type: "number"
          nullable: true
          example: 3.3
        valueText:
          type: "string"
          nullable: true
          example: null
        weight:
          type: "number"
          example: 2
    CapabilityProjection:
      type: "object"
      properties:
        key:
          type: "string"
          example: "voltage"
        valueNum:
          type: "number"
          nullable: true
          example: 3.3
        valueText:
          type: "string"
          nullable: true
          example: null
        weight:
          type: "number"
          example: 2
      description: "Returned by a read that accepts a sparse fieldset: a dotted path such as `placements.quantity` narrows each element to exactly the named sub-keys, so no property here is required. Without one, every property below is present."
    ItemFieldValue:
      type: "object"
      description: "One of the item's custom-field values, resolved exactly as the app resolves it: a value set on the item wins, otherwise the value offered by the nearest ancestor location that makes it inheritable, otherwise the field default. Fields with no value are omitted. Read-only."
      required:
      - "name"
      - "fieldType"
      - "value"
      - "source"
      - "inheritedFrom"
      properties:
        name:
          type: "string"
          example: "Datasheet"
        fieldType:
          type: "string"
          example: "TEXT"
        value:
          type: "string"
          example: "https://example.com/esp32.pdf"
        source:
          type: "string"
          enum:
          - "stored"
          - "inherited"
          - "default"
          example: "stored"
          description: "Where the value came from: set on the item (`stored`), inherited from an ancestor location (`inherited`), or the field default (`default`)."
        inheritedFrom:
          type: "object"
          nullable: true
          description: "The location that supplied the value when `source` is `inherited`; null otherwise."
          required:
          - "locationId"
          - "locationName"
          properties:
            locationId:
              type: "string"
              example: "loc-shelf-2"
            locationName:
              type: "string"
              example: "Shelf 2"
    ItemFieldValueProjection:
      type: "object"
      description: "One of the item's custom-field values, resolved exactly as the app resolves it: a value set on the item wins, otherwise the value offered by the nearest ancestor location that makes it inheritable, otherwise the field default. Fields with no value are omitted. Read-only.\n\nReturned by a read that accepts a sparse fieldset: a dotted path such as `placements.quantity` narrows each element to exactly the named sub-keys, so no property here is required. Without one, every property below is present."
      properties:
        name:
          type: "string"
          example: "Datasheet"
        fieldType:
          type: "string"
          example: "TEXT"
        value:
          type: "string"
          example: "https://example.com/esp32.pdf"
        source:
          type: "string"
          enum:
          - "stored"
          - "inherited"
          - "default"
          example: "stored"
          description: "Where the value came from: set on the item (`stored`), inherited from an ancestor location (`inherited`), or the field default (`default`)."
        inheritedFrom:
          type: "object"
          nullable: true
          description: "The location that supplied the value when `source` is `inherited`; null otherwise."
          required:
          - "locationId"
          - "locationName"
          properties:
            locationId:
              type: "string"
              example: "loc-shelf-2"
            locationName:
              type: "string"
              example: "Shelf 2"
    LocationFieldValue:
      type: "object"
      description: "One custom-field value held by a location. Fields with no value are omitted. Read-only.\n\nReturned by a read that accepts a sparse fieldset: a dotted path such as `placements.quantity` narrows each element to exactly the named sub-keys, so no property here is required. Without one, every property below is present."
      properties:
        name:
          type: "string"
          example: "Indicator Entity"
        fieldType:
          type: "string"
          example: "TEXT"
        value:
          type: "string"
          example: "light.shelf_two"
        isInheritable:
          type: "boolean"
          example: true
          description: "True when the location offers this value to the items stored beneath it; false when it is the location's own metadata only."
    GaugeState:
      type: "object"
      description: "The state of a CONSUMABLE_GAUGE item’s container."
      required:
      - "unitOfMeasure"
      - "grossCapacity"
      - "tareWeight"
      - "currentNetValue"
      - "percentageRemaining"
      - "currentGrossWeight"
      - "attritionPercent"
      properties:
        unitOfMeasure:
          type: "string"
          example: "g"
        grossCapacity:
          type: "number"
          example: 1000
        tareWeight:
          type: "number"
          description: "Empty-container weight/volume."
          example: 220
        currentNetValue:
          type: "number"
          description: "Usable material remaining."
          example: 640
        percentageRemaining:
          type: "number"
          example: 64
        currentGrossWeight:
          type: "number"
          example: 860
        attritionPercent:
          type: "number"
          nullable: true
          description: "Proportional waste a draw costs on top of the amount asked for; null for none."
    ItemSummary:
      type: "object"
      description: "The default row shape of `GET /api/v1/items`, and the item snapshot carried by an event."
      required:
      - "id"
      - "name"
      - "quantity"
      - "isUnlimited"
      - "locationId"
      - "locationName"
      - "categoryId"
      - "mpn"
      - "manufacturer"
      - "trackingMode"
      - "isActive"
      properties:
        id:
          type: "string"
          example: "item-m3-bolt"
        name:
          type: "string"
          example: "M3 x 10 Hex Bolt"
        quantity:
          type: "integer"
          nullable: true
          example: 42
          description: "On-hand grand total across every location. **null** for an unlimited-supply item (`isUnlimited: true`) — an effectively infinite source has no finite count."
        isUnlimited:
          type: "boolean"
          example: false
          description: "True for an effectively infinite source (e.g. tap water); its `quantity` is null."
        locationId:
          type: "string"
          example: "loc-drawer-a"
          description: "The stable id of the item’s primary/home location — what an automation acts on."
        locationName:
          type: "string"
          nullable: true
          example: "Drawer A"
        categoryId:
          type: "string"
          nullable: true
          example: "cat-fasteners"
        mpn:
          type: "string"
          nullable: true
          example: "FAS-M3-10"
        manufacturer:
          type: "string"
          nullable: true
          example: "Acme Fasteners"
        trackingMode:
          type: "string"
          enum:
          - "DISCRETE"
          - "SERIALISED"
          - "CONSUMABLE_GAUGE"
          - "UNTRACKED"
          example: "DISCRETE"
        isActive:
          type: "boolean"
          example: true
    ItemDetail:
      description: "The default payload of `GET /api/v1/items/{id}`, and what a write returns."
      allOf:
      -
        $ref: "#/components/schemas/ItemSummary"
      -
        type: "object"
        required:
        - "placements"
        - "capabilities"
        - "tags"
        properties:
          description:
            type: "string"
            nullable: true
            description: "What the item *is* — factual, display-worthy copy."
          categoryName:
            type: "string"
            nullable: true
            example: "Fasteners"
          unitCost:
            type: "number"
            nullable: true
            description: "Current replacement value per unit, in the base currency; null if unpriced."
          condition:
            type: "string"
            nullable: true
            description: "Operational condition; null when untracked."
          serialNumber:
            type: "string"
            nullable: true
            example: "SN-2024-0042"
            description: "The maker’s per-unit identifier as printed on the article."
          serialNo:
            type: "integer"
            nullable: true
            description: "Instance number (1..N) of a SERIALISED clone; null otherwise."
          parentId:
            type: "string"
            nullable: true
            description: "The parent item when this is a child variant; null for a standalone item."
          expiryDate:
            type: "integer"
            nullable: true
            description: "Perishable expiry instant (UNIX-ms); null when non-perishable."
          batchNumber:
            type: "string"
            nullable: true
          lotNumber:
            type: "string"
            nullable: true
          createdAt:
            type: "integer"
            description: "UNIX-ms."
          updatedAt:
            type: "integer"
            description: "UNIX-ms."
          placements:
            type: "array"
            description: "Where this item’s stock sits, per location."
            items:
              $ref: "#/components/schemas/Placement"
          capabilities:
            type: "array"
            description: "The item’s queryable capability values."
            items:
              $ref: "#/components/schemas/Capability"
          tags:
            type: "array"
            description: "The names of the tags this item carries, ordered by name. A tag *is* its name, so these values can be fed straight back into a `$filter` as `tag eq '<name>'`. Only the item's own tags — a tag on its location belongs to that location."
            items:
              type: "string"
            example:
            - "fragile"
            - "workshop"
          fieldValues:
            type: "array"
            description: "Present only when requested with `include=fields`."
            items:
              $ref: "#/components/schemas/ItemFieldValue"
    Checkout:
      type: "object"
      description: "One loan. The borrower is a tagged union: `borrowerType` says which kind of target holds it and `borrowerId` is that target’s id. `status` is derived from `returnedAt`."
      required:
      - "id"
      - "itemId"
      - "borrowerType"
      - "borrowerId"
      - "quantity"
      - "dueDate"
      - "checkedOutAt"
      - "returnedAt"
      - "status"
      - "note"
      - "returnNote"
      - "sourceLocationId"
      properties:
        id:
          type: "string"
          example: "a3f1c0de-0000-4000-8000-000000000000"
        itemId:
          type: "string"
          example: "item-m3-bolt"
        borrowerType:
          type: "string"
          enum:
          - "contact"
          - "project"
          - "location"
          example: "contact"
        borrowerId:
          type: "string"
          example: "contact-sam"
        quantity:
          type: "integer"
          example: 1
        dueDate:
          type: "integer"
          nullable: true
          description: "UNIX-ms; null for an open-ended loan."
        checkedOutAt:
          type: "integer"
        returnedAt:
          type: "integer"
          nullable: true
          description: "UNIX-ms; null while still out."
        status:
          type: "string"
          enum:
          - "OPEN"
          - "RETURNED"
          example: "OPEN"
        note:
          type: "string"
          nullable: true
        returnNote:
          type: "string"
          nullable: true
          description: "Null while the loan is open."
        sourceLocationId:
          type: "string"
          nullable: true
          description: "The placement the units were drawn from; stock is restored there on return."
    LoanResult:
      type: "object"
      description: "What the loan endpoints return: the affected item plus the loan itself."
      required:
      - "item"
      - "checkout"
      properties:
        item:
          $ref: "#/components/schemas/ItemDetail"
        checkout:
          $ref: "#/components/schemas/Checkout"
    ItemProjection:
      type: "object"
      description: "An item as returned by a read that accepts a **sparse fieldset**, which is why no property here is required.\n\nWithout `fields`/`$select` the payload is the endpoint’s documented default set — `ItemSummary` for the items list, `ItemDetail` for a single item — plus anything added with `include`/`$expand`. With `fields`/`$select` it is EXACTLY the named fields and nothing else, so `fields=name,unitCost` yields an object of two keys. Every property below is one of those selectable fields; which ones arrive is decided per request, so a generated client must treat them all as optional."
      properties:
        id:
          type: "string"
          example: "item-m3-bolt"
        name:
          type: "string"
          example: "M3 x 10 Hex Bolt"
        quantity:
          type: "integer"
          nullable: true
          example: 42
          description: "On-hand grand total across every location. **null** for an unlimited-supply item (`isUnlimited: true`) — an effectively infinite source has no finite count."
        isUnlimited:
          type: "boolean"
          example: false
          description: "True for an effectively infinite source (e.g. tap water); its `quantity` is null."
        locationId:
          type: "string"
          example: "loc-drawer-a"
          description: "The stable id of the item’s primary/home location — what an automation acts on."
        locationName:
          type: "string"
          nullable: true
          example: "Drawer A"
        categoryId:
          type: "string"
          nullable: true
          example: "cat-fasteners"
        categoryName:
          type: "string"
          nullable: true
          example: "Fasteners"
        mpn:
          type: "string"
          nullable: true
          example: "FAS-M3-10"
        manufacturer:
          type: "string"
          nullable: true
          example: "Acme Fasteners"
        trackingMode:
          type: "string"
          enum:
          - "DISCRETE"
          - "SERIALISED"
          - "CONSUMABLE_GAUGE"
          - "UNTRACKED"
          example: "DISCRETE"
        isActive:
          type: "boolean"
          example: true
        description:
          type: "string"
          nullable: true
          description: "What the item *is* — factual, display-worthy copy."
        notes:
          type: "string"
          nullable: true
          description: "The owner’s own free-text remarks."
        condition:
          type: "string"
          nullable: true
          description: "Operational condition; null when untracked."
        barcode:
          type: "string"
          nullable: true
          example: "5012345678900"
          description: "The retail barcode (GTIN — EAN/UPC) printed on the article; null if none. Distinct from `mpn`, which is the maker’s own code."
        isFavourite:
          type: "boolean"
          example: false
          description: "True when the user has starred this item."
        serialNumber:
          type: "string"
          nullable: true
          example: "SN-2024-0042"
          description: "The maker’s per-unit identifier as printed on the article."
        serialNo:
          type: "integer"
          nullable: true
          description: "Instance number (1..N) of a SERIALISED clone; null otherwise."
        parentId:
          type: "string"
          nullable: true
          description: "The parent item when this is a child variant; null for a standalone item."
        unitCost:
          type: "number"
          nullable: true
          description: "Current replacement value per unit, in the base currency; null if unpriced."
        purchasePrice:
          type: "number"
          nullable: true
          description: "Original acquisition cost, in the base currency; null if unpriced."
        currentValue:
          type: "number"
          nullable: true
          description: "Manual current/market value per unit, in the base currency; null when none is set. When present it wins over the depreciated replacement cost in valuation."
        weight:
          type: "number"
          nullable: true
          description: "Intrinsic mass in canonical **grams**; null when not recorded."
        width:
          type: "number"
          nullable: true
          description: "Intrinsic bounding-box width in canonical **millimetres**; null when not recorded."
        height:
          type: "number"
          nullable: true
          description: "Intrinsic bounding-box height in canonical **millimetres**; null when not recorded."
        depth:
          type: "number"
          nullable: true
          description: "Intrinsic bounding-box depth in canonical **millimetres**; null when not recorded."
        expiryDate:
          type: "integer"
          nullable: true
          description: "Perishable expiry instant (UNIX-ms); null when non-perishable."
        batchNumber:
          type: "string"
          nullable: true
        lotNumber:
          type: "string"
          nullable: true
        acquiredAt:
          type: "string"
          format: "date"
          nullable: true
          example: "2025-03-14"
          description: "Acquisition date (YYYY-MM-DD); null when untracked."
        warrantyExpiresAt:
          type: "string"
          format: "date"
          nullable: true
          example: "2027-06-15"
          description: "Warranty expiry date (YYYY-MM-DD); null when untracked."
        depreciationMonths:
          type: "integer"
          nullable: true
          description: "Useful life for straight-line depreciation; null when it does not depreciate."
        deadStockMode:
          type: "string"
          enum:
          - "inherit"
          - "always"
          - "never"
          example: "inherit"
          description: "Whether this item is reported as dead stock. `inherit` — the default — defers to the item’s location chain; the other two override it."
        reorderPoint:
          type: "integer"
          nullable: true
          description: "This item’s own DISCRETE low-stock floor; null falls back to the global default."
        reorderGaugePercent:
          type: "number"
          nullable: true
          description: "This item’s own CONSUMABLE_GAUGE percentage-remaining floor; null falls back to the global default."
        reorderQty:
          type: "integer"
          nullable: true
          description: "Suggested top-up amount for the shopping list; null when unset."
        operationalMetadata:
          type: "object"
          nullable: true
          additionalProperties: true
          description: "A schema-less map of arbitrary operational parameters (e.g. `{ \"bed_temp_celsius\": 60 }`); null when none are set."
          example:
            bed_temp_celsius: 60
        gauge:
          nullable: true
          description: "The consumable-gauge state; null unless `trackingMode` is CONSUMABLE_GAUGE."
          allOf:
          -
            $ref: "#/components/schemas/GaugeState"
        createdAt:
          type: "integer"
          description: "UNIX-ms."
        updatedAt:
          type: "integer"
          description: "UNIX-ms."
        placements:
          type: "array"
          description: "Where this item’s stock sits, per location."
          items:
            $ref: "#/components/schemas/PlacementProjection"
        capabilities:
          type: "array"
          description: "The item’s queryable capability values."
          items:
            $ref: "#/components/schemas/CapabilityProjection"
        tags:
          type: "array"
          description: "The names of the tags this item carries, ordered by name. A tag *is* its name, so these values can be fed straight back into a `$filter` as `tag eq '<name>'`. Only the item's own tags — a tag on its location belongs to that location."
          items:
            type: "string"
          example:
          - "fragile"
          - "workshop"
        fieldValues:
          type: "array"
          description: "The item’s custom-field values, with location inheritance resolved."
          items:
            $ref: "#/components/schemas/ItemFieldValueProjection"
    Location:
      type: "object"
      description: "A location. Without `fields`/`$select` the payload always carries `id`, `name`, `parentId`, `isSystem`, `description`, `color` and `itemCount`, plus `fieldValues` when asked for with `include=fields`. With `fields`/`$select` it carries EXACTLY the named fields — which is why no property is required (issue #367)."
      properties:
        id:
          type: "string"
          example: "loc-drawer-a"
        name:
          type: "string"
          example: "Drawer A"
        parentId:
          type: "string"
          nullable: true
          example: null
        isSystem:
          type: "boolean"
          example: false
        description:
          type: "string"
          nullable: true
        color:
          type: "string"
          nullable: true
        itemCount:
          type: "integer"
          example: 2
        fieldValues:
          type: "array"
          description: "Present only when requested with `include=fields` (or named in `fields`)."
          items:
            $ref: "#/components/schemas/LocationFieldValue"
    CategoryField:
      type: "object"
      required:
      - "id"
      - "name"
      - "fieldType"
      - "options"
      - "isRequired"
      - "defaultValue"
      - "description"
      - "position"
      properties:
        id:
          type: "string"
        name:
          type: "string"
          example: "Voltage"
        fieldType:
          type: "string"
          example: "TEXT"
        options:
          type: "array"
          items:
            type: "string"
          nullable: true
        isRequired:
          type: "boolean"
        defaultValue:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
          example: "Read from the label on the base."
        position:
          type: "integer"
    CategorySummary:
      type: "object"
      required:
      - "id"
      - "name"
      - "fieldCount"
      properties:
        id:
          type: "string"
          example: "cat-electronics"
        name:
          type: "string"
          example: "Electronics"
        fieldCount:
          type: "integer"
          example: 0
    CategoryDetail:
      type: "object"
      required:
      - "id"
      - "name"
      - "fields"
      properties:
        id:
          type: "string"
          example: "cat-electronics"
        name:
          type: "string"
          example: "Electronics"
        fields:
          type: "array"
          items:
            $ref: "#/components/schemas/CategoryField"
    CapabilityKey:
      type: "object"
      required:
      - "key"
      - "itemCount"
      - "hasNumericValues"
      - "hasTextValues"
      properties:
        key:
          type: "string"
          example: "voltage"
        itemCount:
          type: "integer"
          example: 1
        hasNumericValues:
          type: "boolean"
          example: true
        hasTextValues:
          type: "boolean"
          example: false
    WebhookDelivery:
      type: "object"
      description: "One recorded webhook delivery attempt-sequence. Deliberately carries no secret, signature, request header or query string; the URL is reduced to its origin and path (a GET delivery puts its whole payload in the query, which is exactly why it is dropped)."
      required:
      - "seq"
      - "at"
      - "targetId"
      - "targetName"
      - "source"
      - "url"
      - "method"
      - "eventId"
      - "eventType"
      - "outcome"
      - "attempts"
      - "status"
      - "detail"
      properties:
        seq:
          type: "integer"
          description: "Monotonic per-log sequence number; pass the highest back as \"since\"."
          example: 42
        at:
          type: "integer"
          description: "UNIX-ms when the delivery finished."
        targetId:
          type: "string"
          description: "The subscription id for an app-configured webhook, or \"config:<n>\" for one from the operator’s webhooks.json / GUBBINS_BRIDGE_WEBHOOKS_TARGETS."
        targetName:
          type: "string"
          example: "Workshop notifier"
        source:
          type: "string"
          enum:
          - "database"
          - "config"
          description: "Whether the target came from the app’s synced subscriptions or bridge config."
        url:
          type: "string"
          example: "https://hooks.example.test/inventory"
        method:
          type: "string"
          enum:
          - "POST"
          - "GET"
          - "PUT"
          - "PATCH"
        eventId:
          type: "string"
          example: "hist-0007"
        eventType:
          type: "string"
          enum:
          - "events.truncated"
          - "item.changed"
          - "item.checked_in"
          - "item.checked_out"
          - "item.condition_changed"
          - "item.created"
          - "item.low_stock"
          - "item.maintenance_logged"
          - "item.moved"
          - "item.out_of_stock"
          - "item.removed"
          - "item.renamed"
          - "item.reservation_cleared"
          - "item.reserved"
          - "item.restored"
          - "item.supplier_data_applied"
          - "item.tracking_changed"
          - "location.archived"
          - "location.changed"
          - "location.created"
          - "location.moved"
          - "location.removed"
          - "location.renamed"
          - "location.restored"
          - "lookup.resolved"
          - "stock.adjusted"
        outcome:
          type: "string"
          enum:
          - "delivered"
          - "failed"
          - "blocked"
          - "skipped"
          description: "delivered = the receiver answered 2xx; failed = every attempt was made and none succeeded; blocked = refused before any request was issued (the SSRF guard, or an unresolvable secret reference); skipped = the target’s failure circuit was open."
        attempts:
          type: "integer"
          description: "HTTP attempts made (0 when blocked or skipped)."
          example: 1
        status:
          type: "integer"
          nullable: true
          description: "The final response status, or null when no response was ever received."
          example: 204
        detail:
          type: "string"
          nullable: true
          description: "A short, truncated diagnostic — a transport error or a refusal reason. Never a secret."
    BridgeEventData:
      type: "object"
      required:
      - "itemId"
      - "itemName"
      - "action"
      - "kind"
      - "label"
      - "detail"
      - "delta"
      - "quantityDelta"
      - "netValueDelta"
      - "item"
      properties:
        itemId:
          type: "string"
          example: "item-esp32"
        itemName:
          type: "string"
          example: "ESP32 Dev Board"
        action:
          type: "string"
          description: "The raw §4 activity-ledger action."
          example: "QUANTITY_CHANGE"
        kind:
          type: "string"
          enum:
          - "created"
          - "stock"
          - "movement"
          - "loan"
          - "lifecycle"
          - "supplier"
          description: "The semantic activity kind the action folds into."
          example: "stock"
        label:
          type: "string"
          example: "Quantity changed"
        detail:
          type: "string"
          nullable: true
          example: "Checked out 4."
        delta:
          type: "string"
          nullable: true
          description: "A signed movement badge (\"+3\" / \"−45.5\"), or null when there was no movement."
          example: "−4"
        quantityDelta:
          type: "integer"
          nullable: true
          example: -4
        netValueDelta:
          type: "number"
          nullable: true
          example: null
        item:
          nullable: true
          description: "The item’s current summary, or null when the item is no longer present."
          allOf:
          -
            $ref: "#/components/schemas/ItemSummary"
    LookupEventData:
      type: "object"
      required:
      - "query"
      - "itemIds"
      - "locationIds"
      - "matches"
      description: "The payload of a `lookup.resolved` event. `itemIds` and `locationIds` are the flattened, de-duplicated unions across every match, so an automation can trigger on them without walking `matches`."
      properties:
        query:
          type: "string"
          description: "The query as asked (trimmed), verbatim."
          example: "M3 screws"
        itemIds:
          type: "array"
          description: "Every matched item id, in match order, de-duplicated."
          items:
            type: "string"
          example:
          - "itm-m3-bolt"
        locationIds:
          type: "array"
          description: "Every resolved location id across all matches, in encounter order, de-duplicated."
          items:
            type: "string"
          example:
          - "loc-drawer-a"
        matches:
          type: "array"
          items:
            type: "object"
            required:
            - "itemId"
            - "itemName"
            - "placements"
            properties:
              itemId:
                type: "string"
                example: "itm-m3-bolt"
              itemName:
                type: "string"
                example: "M3 × 10mm bolt"
              placements:
                type: "array"
                description: "Where this item’s stock sits, busiest location first."
                items:
                  type: "object"
                  required:
                  - "locationId"
                  - "locationName"
                  - "quantity"
                  properties:
                    locationId:
                      type: "string"
                      example: "loc-drawer-a"
                    locationName:
                      type: "string"
                      example: "Drawer A"
                    quantity:
                      type: "number"
                      example: 120
    BridgeEvent:
      type: "object"
      required:
      - "id"
      - "type"
      - "occurredAt"
      - "data"
      description: "One event delivered over the SSE stream and to outbound webhooks. `id` is deterministic so a consumer can dedupe; `type` is a stable dotted name. Almost every event is derived from a new row in the history ledger — an inventory *change* — and takes its id from that row. The exception is `lookup.resolved`, which is **read**-triggered (someone asked where an item is, and nothing changed): it has no ledger row, so its id is derived from the resolved query instead, and it is only emitted when its own opt-in flag is enabled."
      properties:
        id:
          type: "string"
          example: "hist-0007"
        type:
          type: "string"
          enum:
          - "events.truncated"
          - "item.changed"
          - "item.checked_in"
          - "item.checked_out"
          - "item.condition_changed"
          - "item.created"
          - "item.low_stock"
          - "item.maintenance_logged"
          - "item.moved"
          - "item.out_of_stock"
          - "item.removed"
          - "item.renamed"
          - "item.reservation_cleared"
          - "item.reserved"
          - "item.restored"
          - "item.supplier_data_applied"
          - "item.tracking_changed"
          - "location.archived"
          - "location.changed"
          - "location.created"
          - "location.moved"
          - "location.removed"
          - "location.renamed"
          - "location.restored"
          - "lookup.resolved"
          - "stock.adjusted"
          example: "item.low_stock"
        occurredAt:
          type: "string"
          format: "date-time"
          description: "When the event occurred, as ISO-8601 — the ledger row’s created_at for a ledger-derived event, or the moment the lookup resolved for `lookup.resolved`."
          example: "2025-06-27T06:13:20.000Z"
        data:
          description: "The payload, whose shape follows `type`: `LookupEventData` for `lookup.resolved`, `BridgeEventData` for every ledger-derived event."
          oneOf:
          -
            $ref: "#/components/schemas/BridgeEventData"
          -
            $ref: "#/components/schemas/LookupEventData"
