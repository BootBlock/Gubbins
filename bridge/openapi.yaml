  /api/v1/items/{id}/check-out:
    post:
      tags:
      - "writes"
      summary: "Lend an item out to a contact, project or location"
      description: "Opt-in (GUBBINS_BRIDGE_ALLOW_WRITES=on); returns 404 when writes are disabled. Opens a loan exactly as the app does — a discrete item’s stock is drawn down from the source placement while the loan is open, a serialised item goes out as a whole and cannot be lent twice. Supply exactly one borrower; naming a contact that does not exist creates it, as the app does. The response carries the loan, whose id names it at check-in and is the id the calendar feed embeds in that loan’s UID (loan-<id>@gubbins.invalid). Needs checkouts:write (not stock:write)."
      parameters:
      -
        name: "id"
        in: "path"
        required: true
        description: "The item id."
        schema:
          type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              description: "Exactly one of contactId / contactName / projectId / locationId identifies the borrower; supplying none or several is a 422."
              properties:
                contactId:
                  type: "string"
                  description: "Lend to this existing contact."
                contactName:
                  type: "string"
                  maxLength: 500
                  description: "Lend to a contact by name, creating it when there is no match."
                projectId:
                  type: "string"
                  description: "Lend to this existing project."
                locationId:
                  type: "string"
                  description: "Lend to this existing location (\"in the van\")."
                quantity:
                  type: "integer"
                  minimum: 1
                  description: "Units to lend; defaults to 1. A serialised item always lends as 1."
                dueDate:
                  type: "string"
                  format: "date"
                  nullable: true
                  description: "Due date as a calendar day (yyyy-MM-dd), anchored at local end-of-day so a loan due \"the 20th\" only reads overdue once the 20th is over. Null or absent for an open-ended loan."
                  example: "2026-08-14"
                fromLocationId:
                  type: "string"
                  description: "Draw the units from this placement (the return restores them there); defaults to the item’s own location."
                note:
                  type: "string"
                  nullable: true
                  maxLength: 500
                  description: "Optional note recorded on the loan and in the activity log."
