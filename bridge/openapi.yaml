openapi: "3.0.3"
info:
  title: "Gubbins Bridge API"
  version: "1.0.0"
  description: "Read-only HTTP API over a Gubbins inventory snapshot, served by the local companion bridge. Every endpoint is a read and requires a bearer token; each accepts HEAD as well as GET (same status and headers, no body), so a calendar or feed client can probe a URL before subscribing to it. The one exception is /api/v1/events: a HEAD there reports the media type the stream serves and returns at once, rather than opening a stream, so it carries no Content-Length and never the 429 a GET gives at the concurrent-stream cap. The unversioned paths (/health, /search, /where) are permanent, stable aliases of their /api/v1 equivalents, kept so existing consumers (the Home Assistant integration) keep working unchanged."
  license:
    name: "MIT"
servers:
-
  url: "http://127.0.0.1:8787"
  description: "Local bridge (loopback default)."
security:
-
  bearerAuth: []
tags:
-
  name: "meta"
  description: "Liveness and API description."
-
  name: "search"
  description: "Relevance search and \"where is X?\"."
-
  name: "items"
  description: "Browse items and look one up by id."
-
  name: "calendar"
  description: "A read-only iCalendar (.ics) subscription feed of Gubbins’ time-bearing facts — loan due-backs, asset bookings, maintenance/service dates, and warranty expiries — that any calendar app can subscribe to by URL."
-
  name: "feeds"
  description: "Read-only syndication feeds (RSS 2.0, Atom 1.0, JSON Feed 1.1) of the recent activity log — a human \"what changed\" stream any feed reader can subscribe to by URL."
-
  name: "metrics"
  description: "A Prometheus/OpenMetrics text-exposition of the aggregate inventory counts, at the root /metrics path (the scrape convention), for Grafana/Prometheus home-labs."
-
  name: "locations"
  description: "Browse the locations hierarchy."
-
  name: "categories"
  description: "Browse categories and their custom-field schema."
-
  name: "capabilities"
  description: "Browse the queryable capability vocabulary."
-
  name: "odata"
  description: "A conformant (if small) OData v4 read service at /api/v1/odata, for tools that speak OData natively — Excel/Power Query, Power BI, Simple.OData.Client. It serves a service document, the CSDL $metadata, and the same items/locations/categories reads in the OData JSON envelope ({ \"@odata.context\", \"value\" }) with the OData-Version header. The plain /api/v1 endpoints keep their { data, pagination } envelope, so nothing here changes an existing consumer. Only the items set is filterable, sortable, countable and searchable; the CSDL says so in Org.OData.Capabilities.V1 terms, and a system query option a resource does not support is a 400 rather than being ignored."
-
  name: "writes"
  description: "Opt-in stock and loan mutations (off by default; enabled with GUBBINS_BRIDGE_ALLOW_WRITES=on). Each write round-trips through the same sync merge the PWA uses, so it is applied without drift on the next sync. When writes are disabled these paths return 404."
-
  name: "push"
  description: "Opt-in snapshot ingest — the PWA \"push to bridge\" (off by default; enabled with GUBBINS_BRIDGE_ALLOW_PUSH=on, and only for a JSON snapshot source). A separate opt-in from writes, but a wider privilege: it merges caller-supplied content into the whole served dataset, not a single bounded stock delta. Accepts the same versioned backup JSON the bridge reads from a synced folder, merges it into the served snapshot and writes the result atomically; the watcher then re-hydrates. When push is disabled this path returns 404."
-
  name: "events"
  description: "Opt-in read-only event stream (off by default; enabled with GUBBINS_BRIDGE_EVENTS=on, or implied by GUBBINS_BRIDGE_WEBHOOKS=on). A Server-Sent Events feed of typed inventory-change events, the same events delivered to outbound webhooks. When disabled this path returns 404."
-
  name: "webhooks"
  description: "Opt-in outbound webhooks (off by default; enabled with GUBBINS_BRIDGE_WEBHOOKS=on). The bridge is the sole deliverer: subscriptions are configured in the app and arrive over the existing sync, and the operator’s webhooks.json / GUBBINS_BRIDGE_WEBHOOKS_TARGETS entries are merged alongside them. Delivery outcomes cannot be written back into the snapshot (it is swapped wholesale on every hydration), so the bridge keeps an in-memory delivery log and exposes it here for the app to poll. When disabled this path returns 404."
-
  name: "scale"
  description: "Opt-in Home Assistant reads (off by default; enabled with GUBBINS_BRIDGE_HA=on) — the inbound path behind \"count by weight\". Lets the app read a live weight off a Home Assistant scale entity, reconciled to canonical grams. Outbound-only and read-only: the bridge calls Home Assistant and cannot invoke a service. When disabled these return 404."
paths:
  /api/v1:
    get:
      tags:
      - "meta"
      summary: "API index"
      description: "A small discovery document listing the version and available endpoints."
      responses:
        "200":
          description: "The API index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"
        "401":
          description: "Missing, unknown or revoked API token."
          headers:
            WWW-Authenticate:
              schema:
                type: "string"
              description: "Bearer"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The token is valid, but its owner's role does not permit this route."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: "The request method is not allowed. The bridge answers GET and HEAD everywhere, and POST only on the opt-in write, snapshot-ingest and webhook-test paths. Declared on every operation because the method guard runs ahead of routing, so it answers any request to this path — not only the method documented here. That is also why `Allow` is answered bridge-wide there rather than per path: on a bridge with a POST opt-in enabled it names POST even for a path that only reads. A POST the versioned router itself refuses is the one case answered with that resource’s own methods."
          headers:
            Allow:
              schema:
                type: "string"
              description: "The methods the bridge serves, e.g. \"GET, HEAD, OPTIONS\" — see the description above for when this is bridge-wide rather than scoped to the path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Rate limit exceeded for this client."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "An unexpected failure the bridge could not attribute to the request. The message is fixed and detail-free — no stack trace, file path, SQL or query text ever reaches a caller (the detail is logged locally only)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "No snapshot has been loaded yet, so the bridge does not yet know who any caller is and lets nobody in. Reachable at every path — including the reads that need no snapshot data of their own — because the check precedes routing. Retry once the snapshot lands."
          headers:
            Retry-After:
              schema:
                type: "integer"
              description: "Seconds to wait before retrying."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
