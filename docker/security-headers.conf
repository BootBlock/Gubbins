# Response headers every Gubbins response must carry (see nginx.conf.in).
#
# This lives in a separate file because nginx's `add_header` inheritance is
# all-or-nothing: a location inherits the enclosing level's headers if and only if it
# declares NO `add_header` of its own. Most locations in nginx.conf.in set their own
# Cache-Control, so each of those has to restate the whole set — nginx has no additive
# form. Including one snippet keeps the set in a single place instead of several copies
# that drift. A location that declares no `add_header` at all still inherits, and so
# does not need the include.
#
# Kept OUT of /etc/nginx/conf.d/, whose *.conf files are auto-included into the http
# context — this is included explicitly, per level, by nginx.conf.in.

# Cross-origin isolation (spec §2.2.6) — without both of these the SQLite OPFS VFS
# cannot get SharedArrayBuffer and the database fails to open. `always` so they are
# sent on error responses too, not just 2xx/3xx.
add_header Cross-Origin-Opener-Policy   same-origin  always;
add_header Cross-Origin-Embedder-Policy require-corp always;

# Same-origin subresources satisfy COEP without this, but stating it explicitly stops
# any asset here from being embedded by another origin.
add_header Cross-Origin-Resource-Policy same-origin  always;

# Gubbins sends no data anywhere, but these cost nothing and harden the deployment.
# X-Frame-Options in particular is the only framing defence on a navigation the service
# worker has not taken over (a first visit, a cleared site, a bypassed reload): the
# worker's own CSP carries `frame-ancestors 'none'`, but the build-time <meta> copy
# cannot express that directive at all (see src/csp.ts).
add_header X-Content-Type-Options nosniff     always;
add_header Referrer-Policy        no-referrer  always;
add_header X-Frame-Options        DENY         always;
