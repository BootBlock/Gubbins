version: 2
updates:
  # Web app dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Fold routine minor/patch bumps into a single PR to keep the noise down;
      # major bumps still come through individually so they can be reviewed.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Optional bridge / integration server (separate package).
  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bridge-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the GitHub Actions used by the workflows current.
  #
  # Every `uses:` in `.github/workflows/` is pinned to a full commit SHA with the release it
  # corresponds to in a trailing comment, rather than to a major tag: a tag is a pointer its
  # owner can repoint at any commit, so a tag-pinned workflow is not reproducible and silently
  # takes whatever code that pointer names today. Dependabot understands this form — it bumps
  # the SHA and rewrites the comment — so pinning costs no maintenance, it just moves the
  # upgrade into a reviewable pull request instead of happening unannounced.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
