version: 2
updates:
  # Web app dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Fold routine minor/patch bumps into a single PR to keep the noise down;
      # major bumps still come through individually so they can be reviewed.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Optional bridge / integration server (separate package).
  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bridge-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the GitHub Actions used by the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
