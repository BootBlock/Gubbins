name: Relock

# One-shot helper: regenerate package-lock.json on Linux (matching the CI runner) so its
# optional WASM dependency tree resolves identically to `npm ci`. Run manually from the
# Actions tab, then download the "package-lock" artifact. This workflow is intended to be
# removed again once the refreshed lock file has been committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 25

      - name: Regenerate the lock file
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
          echo "emnapi entries now in the lock file:"
          grep -A1 'node_modules/@emnapi/\(core\|runtime\)"' package-lock.json | grep '"version"' | sort | uniq -c

      - name: Upload the regenerated lock file
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
