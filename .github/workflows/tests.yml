name: Tests

# Runs on every push to main and on pull requests. A secret-scan gate (shared with the local
# pre-commit hook) plus a quality job (lint/format/type-check), then the unit tests: the app
# suite (root Vitest config) and the bridge suite (its own Node-only config + a type-check). The
# test and quality jobs both need a recent Node — the app's `:memory:` test driver and the bridge both use `node:sqlite`,
# and Gubbins' schema needs `node:sqlite`'s FTS5 support (Node >= 22.16 or >= 24 — NOT any
# v23.x build, FTS5 was never backported there). The bridge additionally runs TypeScript
# directly via Node's built-in type-stripping, unflagged only from Node 22.18 — so these jobs
# pin Node 25, which satisfies the requirement above and matches the local dev toolchain so the
# lockfile resolves identically. One extra job (`bridge-min-node`) deliberately does not: it
# boots the bridge on the exact floor `bridge/package.json` declares, so the declared minimum
# is a version something actually runs rather than a number nobody exercises (issue #256).
#
# `workflow_call` also exposes this whole suite as a reusable gate: the Deploy workflow invokes
# it (against the exact ref being published) and blocks its build on a green result, so the same
# secret-scan / quality / app / bridge checks run before anything reaches production — an
# operator can no longer one-click-deploy an unmerged ref that CI has never seen (issue #275).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least-privilege: the tests only need to read the checkout.
permissions:
  contents: read

jobs:
  # Authoritative secret-scan gate. The local pre-commit hook runs the same scanner, but only on
  # a developer's machine and only if the hook was wired — a `--no-verify` commit or a clone that
  # never ran `npm install` bypasses it. This job re-scans the lines a push or PR adds so a
  # credential still fails the build. It shares `scripts/secret-scan.mjs` with the hook (one
  # pattern set, no drift) and needs neither an install nor a recent Node — only git history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan can diff the pushed/PR range, not just the tip snapshot.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25

      - name: Scan added lines for credential-shaped content
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            # A brand-new branch reports an all-zero "before". A force-push to main reports a now
            # orphaned tip that history no longer reaches. In either case there is no usable base,
            # so fall back to HEAD's parent (and HEAD itself if there is no parent) — the scan then
            # covers the newest commit rather than failing the build on an unreachable ref.
            base="$PUSH_BEFORE"
            case "$base" in '' | 0000000000000000000000000000000000000000) base='' ;; esac
            if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=''; fi
            [ -n "$base" ] || base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          node scripts/secret-scan.mjs --diff "$base"

  quality:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `type-check` runs the app's `tsc -b`; ESLint's type-aware rules also drive the
          # TypeScript program. Pin the same Node 25 the test jobs use for consistency.
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on types first, then lint, then formatting — cheapest signal last.
      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Link/image integrity for the staged wiki. The publish workflow gates on this too, but
      # running it here means a broken `[[link]]` fails the PR that introduced it rather than
      # the publish that would have shipped it.
      - name: Check wiki integrity
        run: npm run wiki:check

  app:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The app's `:memory:` test driver uses `node:sqlite` (Node >= 22.5), so the
          # test job needs a recent Node even though the shipped PWA runs in the browser.
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

  bridge:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The bridge has no build step — it runs TypeScript directly, which needs
          # Node >= 24 (or >= 22.18 LTS) for unflagged type-stripping and node:sqlite
          # with FTS5 (the v23.x line never got FTS5). It has no deps of its own and
          # borrows the repo-root toolchain (Vitest/TypeScript).
          node-version: 25
          cache: npm

      - name: Install dependencies (repo-root toolchain)
        run: npm ci

      - name: Type-check the bridge
        run: npm run type-check:bridge

      - name: Run bridge tests
        run: npm run test:bridge

      # Boot-smoke both entry points under REAL Node (not esbuild/Vitest), so any
      # strip-only-incompatible TypeScript in the bridge's import graph — parameter
      # properties, enum, namespace — fails here rather than only at runtime.
      - name: Boot-smoke the bridge
        run: npm run smoke:bridge

  # The floor, exercised. Everything else here runs on Node 25, so `bridge/package.json`'s
  # `engines` range was previously just an assertion — it drifted below the version where
  # Node's type-stripping is unflagged and nothing noticed, because no job ever ran the
  # minimum (issue #256). This one boots both entry points on exactly that floor, so raising
  # or lowering the declared minimum has to be true for CI to stay green.
  bridge-min-node:
    name: Bridge boot on the minimum Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with the bottom of `bridge/package.json`'s `engines.node` range —
          # the lowest Node the bridge claims to run on unaided. `npm ci` warns about the
          # repo root's own `engines` (>=24, for the app's dev toolchain) and proceeds; only
          # the bridge is under test here.
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies (repo-root toolchain)
        run: npm ci

      # The same boot-smoke as above. Passing here means the declared floor genuinely starts:
      # type-stripping is on without a flag, and node:sqlite has the FTS5 the schema needs.
      - name: Boot-smoke the bridge
        run: npm run smoke:bridge
