name: Deploy to GitHub Pages

# Manual-only: this never runs on push. Publish a new version by opening the
# repo's "Actions" tab, selecting this workflow, and clicking "Run workflow".
# It builds the chosen branch (default: main) and deploys it to GitHub Pages.
on:
  workflow_dispatch:

# Permissions the deploy needs (least-privilege).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer run *queues* behind an in-flight one rather than
# cancelling it: `actions/deploy-pages` killed mid-flight can leave the Pages deployment
# in a failed or indeterminate state instead of being cleanly superseded, and this is the
# only publish path for the app. Letting the first run finish is the safe ordering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Release marker, checked BEFORE the build (issue #276). With no tags at all, "what is
      # currently deployed?" is unanswerable and "redeploy the last good build" means picking a
      # SHA out of `git log` by eye. The deploy job tags the commit it publishes as `v<version>`
      # — but that only stays meaningful if each new deploy carries a new version, so refuse
      # here rather than after spending a build. Re-deploying the *same* commit is idempotent
      # and allowed; re-deploying different code under a version already published is not.
      - name: Check the release version is free
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Resolve to the *commit* the tag names. These are annotated tags, so `refs/tags/$tag`
          # is the tag object's own SHA — comparing that to $GITHUB_SHA would never match, and
          # every re-deploy would be rejected. `^{}` is the peeled ref (the commit); it only
          # exists for annotated tags, so fall back to the plain ref for a lightweight one.
          existing="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error title=Release version already published::Tag $tag already points at $existing, but this deploy is $GITHUB_SHA. Bump \"version\" in package.json before deploying new code."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag from $GITHUB_SHA."

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 25 across all CI/build, matching the local dev toolchain so `npm ci`
          # resolves the lockfile identically (see the Tests workflow for the rationale).
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Google Drive OAuth client id is PUBLIC (it ships in the client bundle by
      # design and has no client secret), so it lives in a repository *variable*, not a
      # secret. Left undefined the build still succeeds — Google Drive sync is simply
      # hidden in the deployed app — so say so loudly rather than failing silently.
      - name: Check Google Drive sync configuration
        # Read the variable through `env:` rather than interpolating it into the script —
        # `${{ }}` is substituted before the shell runs, so its contents would be parsed
        # as shell source.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning title=Google Drive sync disabled::Repository variable VITE_GOOGLE_CLIENT_ID is not set, so the Google Drive sync provider will be hidden in this deployment. Set it under Settings → Secrets and variables → Actions → Variables (see docs/dev/google-drive-sync.md)."
          else
            echo "VITE_GOOGLE_CLIENT_ID is set; Google Drive sync will be available."
          fi

      # `public/ocr/` is git-ignored (several MB of Tesseract binaries), so a CI checkout has
      # none of it and a build would quietly publish an app whose on-device OCR can never
      # load. Stage the assets here, with `--require` so a failure breaks the deploy rather
      # than shipping a feature that only appears to exist.
      - name: Stage on-device OCR assets
        run: npm run ocr:assets -- --require

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Record what was published (issue #276). Runs only after the deploy actually succeeded, so a
  # tag means "this commit reached production", not "someone tried". That gives the rollback
  # story its missing first half: `git tag` lists every release, `v<version>` names the commit
  # serving right now, and re-running this workflow against the previous tag redeploys it.
  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Tag the deployed commit
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Idempotent: re-deploying the same commit re-runs this, and the pre-build check has
          # already guaranteed any existing tag of this name points here.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)" ]; then
            echo "$TAG already recorded for this commit — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Gubbins $VERSION — deployed to GitHub Pages by run $GITHUB_RUN_ID."
          git push origin "refs/tags/$TAG"
          echo "Recorded release $TAG at $GITHUB_SHA."
