name: Deploy to GitHub Pages

# Manual-only: this never runs on push. Publish a new version by opening the
# repo's "Actions" tab, selecting this workflow, and clicking "Run workflow".
# It builds the chosen branch (default: main) and deploys it to GitHub Pages.
on:
  workflow_dispatch:

# Permissions the deploy needs (least-privilege).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer run *queues* behind an in-flight one rather than
# cancelling it: `actions/deploy-pages` killed mid-flight can leave the Pages deployment
# in a failed or indeterminate state instead of being cleanly superseded, and this is the
# only publish path for the app. Letting the first run finish is the safe ordering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 25 across all CI/build, matching the local dev toolchain so `npm ci`
          # resolves the lockfile identically (see the Tests workflow for the rationale).
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Google Drive OAuth client id is PUBLIC (it ships in the client bundle by
      # design and has no client secret), so it lives in a repository *variable*, not a
      # secret. Left undefined the build still succeeds — Google Drive sync is simply
      # hidden in the deployed app — so say so loudly rather than failing silently.
      - name: Check Google Drive sync configuration
        # Read the variable through `env:` rather than interpolating it into the script —
        # `${{ }}` is substituted before the shell runs, so its contents would be parsed
        # as shell source.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning title=Google Drive sync disabled::Repository variable VITE_GOOGLE_CLIENT_ID is not set, so the Google Drive sync provider will be hidden in this deployment. Set it under Settings → Secrets and variables → Actions → Variables (see docs/dev/google-drive-sync.md)."
          else
            echo "VITE_GOOGLE_CLIENT_ID is set; Google Drive sync will be available."
          fi

      # `public/ocr/` is git-ignored (several MB of Tesseract binaries), so a CI checkout has
      # none of it and a build would quietly publish an app whose on-device OCR can never
      # load. Stage the assets here, with `--require` so a failure breaks the deploy rather
      # than shipping a feature that only appears to exist.
      - name: Stage on-device OCR assets
        run: npm run ocr:assets -- --require

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
