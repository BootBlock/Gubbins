name: Deploy to GitHub Pages

# Manual-only: this never runs on push. Publish a new version by opening the
# repo's "Actions" tab, selecting this workflow, and clicking "Run workflow".
# It builds the chosen branch (default: main) and deploys it to GitHub Pages.
#
# The chosen ref is gated on CI first: the `ci` job below runs the full Tests suite
# (secret-scan, lint/format/type-check, app + bridge unit tests, bridge boot-smoke)
# against exactly the ref being deployed, and `build` needs it. Because
# `workflow_dispatch` lets the operator pick any ref — including an unmerged branch CI
# has never seen — running those checks here, not just on push/PR, is the only thing
# that stops a broken commit reaching every user's device in one click (issue #275).
on:
  workflow_dispatch:

# Permissions the deploy needs (least-privilege).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. A newer run *queues* behind an in-flight one rather than
# cancelling it: `actions/deploy-pages` killed mid-flight can leave the Pages deployment
# in a failed or indeterminate state instead of being cleanly superseded, and this is the
# only publish path for the app. Letting the first run finish is the safe ordering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI gate. Reuse the Tests workflow wholesale rather than re-listing its jobs here, so the
  # deploy path and the push/PR path can never drift — one definition, one source of truth.
  # It runs against the ref this deploy was dispatched on, so an unmerged branch is verified
  # before it can be published. A called workflow can't request more permission than its
  # caller, and Tests only reads the checkout, so no extra grant is needed.
  ci:
    uses: ./.github/workflows/tests.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release marker, checked BEFORE the build (issue #276). With no tags at all, "what is
      # currently deployed?" is unanswerable and "redeploy the last good build" means picking a
      # SHA out of `git log` by eye. The deploy job tags the commit it publishes as `v<version>`
      # — but that only stays meaningful if each new deploy carries a new version, so refuse
      # here rather than after spending a build. Re-deploying the *same* commit is idempotent
      # and allowed; re-deploying different code under a version already published is not.
      - name: Check the release version is free
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Resolve to the *commit* the tag names. These are annotated tags, so `refs/tags/$tag`
          # is the tag object's own SHA — comparing that to $GITHUB_SHA would never match, and
          # every re-deploy would be rejected. `^{}` is the peeled ref (the commit); it only
          # exists for annotated tags, so fall back to the plain ref for a lightweight one.
          existing="$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/$tag" | cut -f1)"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error title=Release version already published::Tag $tag already points at $existing, but this deploy is $GITHUB_SHA. Bump \"version\" in package.json before deploying new code."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag from $GITHUB_SHA."

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 25 across all CI/build, matching the local dev toolchain so `npm ci`
          # resolves the lockfile identically (see the Tests workflow for the rationale).
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Google Drive OAuth client id is PUBLIC (it ships in the client bundle by
      # design and has no client secret), so it lives in a repository *variable*, not a
      # secret. Left undefined the build still succeeds — Google Drive sync is simply
      # hidden in the deployed app — so say so loudly rather than failing silently.
      - name: Check Google Drive sync configuration
        # Read the variable through `env:` rather than interpolating it into the script —
        # `${{ }}` is substituted before the shell runs, so its contents would be parsed
        # as shell source.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning title=Google Drive sync disabled::Repository variable VITE_GOOGLE_CLIENT_ID is not set, so the Google Drive sync provider will be hidden in this deployment. Set it under Settings → Secrets and variables → Actions → Variables (see docs/dev/google-drive-sync.md)."
          else
            echo "VITE_GOOGLE_CLIENT_ID is set; Google Drive sync will be available."
          fi

      # `public/ocr/` is git-ignored (several MB of Tesseract binaries), so a CI checkout has
      # none of it and a build would quietly publish an app whose on-device OCR can never
      # load. Stage the assets here, with `--require` so a failure breaks the deploy rather
      # than shipping a feature that only appears to exist.
      - name: Stage on-device OCR assets
        run: npm run ocr:assets -- --require

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Record what was published (issue #276). Runs only after the deploy actually succeeded, so a
  # tag means "this commit reached production", not "someone tried". That gives the rollback
  # story its missing first half: `git tag` lists every release, `v<version>` names the commit
  # serving right now, and re-running this workflow against the previous tag redeploys it. The tag
  # is then published as a GitHub release, because that is the only version signal HACS reads for
  # the Home Assistant integration (issue #718).
  tag:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the deployed commit
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Idempotent: re-deploying the same commit re-runs this, and the pre-build check has
          # already guaranteed any existing tag of this name points here.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)" ]; then
            echo "$TAG already recorded for this commit — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Gubbins $VERSION — deployed to GitHub Pages by run $GITHUB_RUN_ID."
          git push origin "refs/tags/$TAG"
          echo "Recorded release $TAG at $GITHUB_SHA."

      # Publish that tag as a GitHub *release* (issue #718). A bare tag is invisible to the
      # releases API, and that API is the only place HACS looks: a repository with no releases
      # is tracked by its default branch instead, and HACS then compares the commit it installed
      # against the head of `main`. Every commit pushed here therefore told every Home Assistant
      # user that the Gubbins integration had an update — several times a day, for changes that
      # never touched `custom_components/gubbins/`. With releases present, HACS tracks the latest
      # release tag, so an update appears when a version is actually published.
      #
      # A separate step from the tagging above, not an extra line inside it: the tag step returns
      # early when the tag already exists, and a tag with no release is exactly the state this
      # needs to repair. Keeping them apart lets a re-run back-fill one.
      - name: Publish the tag as a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG is already published — nothing to do."
            exit 0
          fi
          # --verify-tag fails when the tag is missing rather than creating one; without it `gh`
          # would silently tag the default branch's head, which is not necessarily the commit
          # this run deployed. --generate-notes writes GitHub's own commit/PR summary for the
          # range since the previous release, so the notes have no second source to drift from.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gubbins $VERSION" \
            --generate-notes
          echo "Published release $TAG."
