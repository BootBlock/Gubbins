# Which bridge a call is for: every service below takes an optional config_entry_id.
#
# More than one Gubbins bridge is a supported setup — a home vault and a workshop one, say — and
# each gets its own config entry, device and sensors. These services, though, are registered once
# for the domain, so a call has to say which bridge it means. Leave the field empty and the single
# configured bridge is used, exactly as before; with two set up, a call that names neither is
# refused rather than sent to whichever happened to load first. That matters most for the five
# write services: applying a workshop change to the home vault succeeds, and looks like a success.
#
# Read-only search against the Gubbins bridge. Returns the matched items as response
# data (use response_variable in a script/automation, or "Call service" in Developer
# Tools to see the result). It never modifies inventory.
#
# The response carries the bridge's own "matches", plus "location_ids" (every resolved
# location id, deduped) and "located_matches" (the same matches in the snake_case shape
# used by the gubbins_item_located event), so a script or dashboard can map a match to a
# place without going through the voice intent.
search:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    query:
      required: true
      example: "ESP32"
      selector:
        text:
    limit:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 25
          mode: box

# Every one of the five write services below takes an optional idempotency_key. It exists because
# a bridge write costs work proportional to the size of the whole inventory, so on a large vault
# it can outlast the client's patience while still succeeding — and each of these changes is
# RELATIVE (a delta, a move, a loan), so simply calling again applies it a second time. Pass a
# value you generate once per intended change, and reuse that same value if you repeat the call:
# the bridge then answers with the first attempt's result instead of changing anything again.
# Leave it out and the behaviour is unchanged — every call applies.
#
# Opt-in change to a discrete item's count. One of five services that change inventory, and they
# work only when the bridge is started with GUBBINS_BRIDGE_ALLOW_WRITES=on (otherwise they error
# with "writes disabled"). The change round-trips through the app's own sync merge, so the PWA
# applies it conflict-free on its next sync. Use a negative delta for stock going out, positive for
# stock coming in. item_id is the Gubbins record id (find it via the search service or /api/v1).
# This moves a number only — to record WHO has something, use check_out / check_in below.
adjust_quantity:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    item_id:
      required: true
      example: "item-esp32"
      selector:
        text:
    delta:
      required: true
      example: -1
      selector:
        number:
          min: -1000000
          max: 1000000
          mode: box
    note:
      required: false
      example: "Checked out for the workshop"
      selector:
        text:
    idempotency_key:
      required: false
      example: "2f1a9c8e-0b57-4a2d-9f3e-6c5d4b3a2109"
      selector:
        text:

# The gauge counterpart of adjust_quantity, for a CONSUMABLE_GAUGE item — one whose contents are
# measured (grams of filament, millilitres of resin) rather than counted. Use a negative delta for
# an amount used, positive for a refill; fractional values are fine. Subject to the same
# GUBBINS_BRIDGE_ALLOW_WRITES=on opt-in, and round-tripped through the app's own sync merge in the
# same way. The app clamps the result between empty and the item's capacity, and the call is
# rejected if the item isn't gauge-tracked. This pairs naturally with a smart scale: read the
# weight in Home Assistant, send the difference here.
adjust_gauge:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    item_id:
      required: true
      example: "item-pla-filament"
      selector:
        text:
    delta:
      required: true
      example: -45
      selector:
        number:
          min: -1000000
          max: 1000000
          step: 0.001
          mode: box
    note:
      required: false
      example: "Printed the bracket"
      selector:
        text:
    idempotency_key:
      required: false
      example: "2f1a9c8e-0b57-4a2d-9f3e-6c5d4b3a2109"
      selector:
        text:

# Lend an item out. Distinct from adjust_quantity, which only moves a number: a loan records WHO
# has the item and when it is due, which is what the "on loan" and "overdue" binary sensors report
# and what the app's calendar feed publishes. Same GUBBINS_BRIDGE_ALLOW_WRITES=on opt-in as the
# adjust services; the token's account additionally needs the checkouts permission, since the app
# draws the same line between adjusting stock and lending it.
#
# Supply exactly ONE borrower: contact_name (created if it matches nobody), contact_id, project_id
# or location_id. The response carries the loan — keep its id if you want check_in to name that
# exact loan later, though you rarely need to.
check_out:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    item_id:
      required: true
      example: "item-esp32"
      selector:
        text:
    contact_name:
      required: false
      example: "Sam Okafor"
      selector:
        text:
    contact_id:
      required: false
      example: "contact-sam"
      selector:
        text:
    project_id:
      required: false
      example: "project-bench-build"
      selector:
        text:
    location_id:
      required: false
      example: "loc-van"
      selector:
        text:
    quantity:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    due_date:
      required: false
      example: "2026-08-14"
      selector:
        date:
    from_location_id:
      required: false
      example: "loc-shelf-2"
      selector:
        text:
    note:
      required: false
      example: "For the bench build"
      selector:
        text:
    idempotency_key:
      required: false
      example: "2f1a9c8e-0b57-4a2d-9f3e-6c5d4b3a2109"
      selector:
        text:

# Take a lent item back: the stock returns to the place (and lot) it was lent from and the loan
# closes. checkout_id is only needed when the item has more than one loan open at once — with a
# single open loan the item id alone is unambiguous, so "that's back now" needs nothing else.
# Same GUBBINS_BRIDGE_ALLOW_WRITES=on opt-in and checkouts permission as check_out.
check_in:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    item_id:
      required: true
      example: "item-esp32"
      selector:
        text:
    checkout_id:
      required: false
      example: "a3f1c0de-0000-4000-8000-000000000000"
      selector:
        text:
    note:
      required: false
      example: "Back on the shelf"
      selector:
        text:
    idempotency_key:
      required: false
      example: "2f1a9c8e-0b57-4a2d-9f3e-6c5d4b3a2109"
      selector:
        text:

# Move stock from one location to another, for a DISCRETE (counted) item — a gauge measures one
# body of material and has nothing to split, so it is refused. This changes WHERE stock is;
# adjust_quantity above changes HOW MUCH there is, and only ever at the item's home location, so it
# cannot express a move. The item's total is unchanged afterwards, and each moved lot keeps its
# batch and expiry at the destination. All of it moves or none does — too little at the source is
# an error, never a silent partial move. Same GUBBINS_BRIDGE_ALLOW_WRITES=on opt-in and stock
# permission as adjust_quantity. Location ids come from the app or /api/v1/locations.
transfer_stock:
  fields:
    config_entry_id:
      required: false
      example: "01JABCDEF0123456789ABCDEFG"
      selector:
        config_entry:
          integration: gubbins
    item_id:
      required: true
      example: "item-esp32"
      selector:
        text:
    from_location_id:
      required: true
      example: "loc-shelf-2"
      selector:
        text:
    to_location_id:
      required: true
      example: "loc-bin-4"
      selector:
        text:
    quantity:
      required: true
      example: 5
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
    idempotency_key:
      required: false
      example: "2f1a9c8e-0b57-4a2d-9f3e-6c5d4b3a2109"
      selector:
        text:
